t="34" rx="8" fill="none" stroke="var(--constraint)" stroke-width="2"/><text x="71" y="61" class="mono" font-size="17" font-weight="700" fill="var(--constraint)" text-anchor="middle">15</text><text x="114" y="62" class="t ttl">The nested hierarchy</text><text x="114" y="88" class="m sub">Four levels, all active at once — two of them manufactured by the process</text><line x1="44" y1="108" x2="1196" y2="108" stroke="var(--stroke)" stroke-width="1.5"/><rect x="80.0" y="168.0" width="900.0" height="104.0" rx="12" fill="var(--resonance)" stroke="none" stroke-width="1.5" opacity="0.1" /><rect x="80.0" y="168.0" width="900.0" height="104.0" rx="12" fill="none" stroke="var(--resonance)" stroke-width="2.2" opacity="1" /><rect x="80.0" y="168.0" width="7.0" height="104.0" rx="3.5" fill="var(--resonance)" stroke="none" stroke-width="1.5" opacity="1" /><text x="108.0" y="202.0" class="xs" text-anchor="start" opacity="1" fill="var(--resonance)" font-weight="700">LEVEL 4</text><text x="178.0" y="202.0" class="t lbl" text-anchor="start" opacity="1" >Feedback constraints generated by the form</text><text x="108.0" y="242.0" class="m sm" text-anchor="start" opacity="1" >vapour shadows · diffusion fields · depletion zones · shielding</text><rect x="1000.0" y="190.0" width="160.0" height="60.0" rx="9" fill="var(--resonance)" stroke="none" stroke-width="1.5" opacity="0.18" /><rect x="1000.0" y="190.0" width="160.0" height="60.0" rx="9" fill="none" stroke="var(--resonance)" stroke-width="2" opacity="1" /><text x="1080.0" y="215.0" class="xs" text-anchor="middle" opacity="1" fill="var(--resonance)">CREATED BY</text><text x="1080.0" y="236.0" class="xs" text-anchor="middle" opacity="1" fill="var(--resonance)">THE PROCESS</text><rect x="80.0" y="284.0" width="900.0" height="104.0" rx="12" fill="var(--topdown)" stroke="none" stroke-width="1.5" opacity="0.1" /><rect x="80.0" y="284.0" width="900.0" height="104.0" rx="12" fill="none" stroke="var(--topdown)" stroke-width="2.2" opacity="1" /><