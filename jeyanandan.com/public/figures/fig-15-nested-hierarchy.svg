var(--faint)">GIVEN</text><rect x="80.0" y="516.0" width="900.0" height="104.0" rx="12" fill="var(--constraint)" stroke="none" stroke-width="1.5" opacity="0.1" /><rect x="80.0" y="516.0" width="900.0" height="104.0" rx="12" fill="none" stroke="var(--constraint)" stroke-width="2.2" opacity="1" /><rect x="80.0" y="516.0" width="7.0" height="104.0" rx="3.5" fill="var(--constraint)" stroke="none" stroke-width="1.5" opacity="1" /><text x="108.0" y="550.0" class="xs" text-anchor="start" opacity="1" fill="var(--constraint)" font-weight="700">LEVEL 1</text><text x="178.0" y="550.0" class="t lbl" text-anchor="start" opacity="1" >Fundamental and local constraints</text><text x="108.0" y="590.0" class="m sm" text-anchor="start" opacity="1" >molecular geometry · hydrogen bonding · lattice energetics</text><rect x="1000.0" y="538.0" width="160.0" height="60.0" rx="9" fill="none" stroke="var(--faint)" stroke-width="1.4" opacity="1" stroke-dasharray="5 5" /><text x="1080.0" y="574.0" class="xs" text-anchor="middle" opacity="1" fill="var(--faint)">GIVEN</text><line x1="1075.0" y1="274.0" x2="1075.0" y2="380.0" stroke="var(--topdown)" stroke-width="2.4" stroke-linecap="round" opacity="1"/><path d="M1075.0,380.0 L1071.3,371.8 L1078.7,371.8 Z" fill="var(--topdown)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="1156.0" y="330.0" class="xs" text-anchor="end" opacity="1" fill="var(--topdown)">acts back</text><rect x="80.0" y="632.0" width="1080.0" height="4.0" rx="0" fill="var(--stroke)" stroke="none" stroke-width="1.5" opacity="1" /><text x="620.0" y="616.0" class="t lbl" text-anchor="middle" opacity="1" >Levels 3 and 4 did not exist when the process began. The system manufactured them, then became subject to them.</text></svg>