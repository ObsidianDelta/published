<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1205.58" width="1340" height="1205.58" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1340" height="1205.58" fill="#FAF7F0"/>
<line x1="26" y1="16" x2="1314" y2="16" stroke="#B5AE9C" stroke-width="1"/>
<line x1="26" y1="1189.58" x2="1314" y2="1189.58" stroke="#B5AE9C" stroke-width="1"/>
<text x="670" y="54.27" font-size="40.2" fill="#1A1A1A" font-weight="600" text-anchor="middle">Four properties</text>
<text x="670" y="93.73" font-size="25.46" fill="#555555" text-anchor="middle" font-style="italic">Row 24 of the genealogy, beside a constraint that is declared</text>
<text x="670" y="123.85" font-size="19.43" fill="#888888" text-anchor="middle">The four tests are the author’s; the row 24 column quotes the row’s own data</text>
<rect x="50" y="196" width="1240" height="182" fill="#FFFFFF" stroke="#9F9A8E" stroke-width="0.8" rx="4"/>
<rect x="50" y="196" width="11" height="182" fill="#5A2218"/>
<rect x="61" y="196" width="1229" height="13" fill="#5A2218" opacity="0.6"/>
<circle cx="102" cy="250" r="26" fill="#1A1A1A"/>
<text x="102" y="258" font-size="23" fill="white" font-weight="700" text-anchor="middle">24</text>
<text x="142" y="250" font-size="28" fill="#1A1A1A" font-weight="700">Attention economy</text>
<text x="142" y="274" font-size="14.5" fill="#888888" font-weight="500" letter-spacing="0.8">MOBILE ERA</text>
<text x="1270" y="240" font-size="16" fill="#555555" text-anchor="end" font-family="ui-monospace, Menlo, monospace">~2010–present</text>
<circle cx="1066" cy="266" r="4.2" fill="#DDEAB8"/>
<circle cx="1078" cy="266" r="4.2" fill="#E5DAA0"/>
<circle cx="1090" cy="266" r="4.2" fill="#E8C880"/>
<circle cx="1102" cy="266" r="4.2" fill="#E5AC65"/>
<circle cx="1114" cy="266" r="4.2" fill="#DA8E55"/>
<circle cx="1126" cy="266" r="4.2" fill="#C57045"/>
<circle cx="1138" cy="266" r="4.2" fill="#A85535"/>
<circle cx="1150" cy="266" r="4.2" fill="#7D3825"/>
<circle cx="1162" cy="266" r="4.2" fill="#5A2218"/>
<circle cx="1174" cy="266" r="4.2" fill="#EEEAE0"/>
<text x="1194.4" y="270.76" font-size="14" fill="#888888">sev 9/10</text>
<text x="72" y="304" font-size="17" fill="#1A1A1A">Engagement metrics, infinite scroll, variable-reward</text>
<text x="72" y="326" font-size="17" fill="#1A1A1A">loops. Cognitive enclosure.</text>
<text x="72" y="362" font-size="14.5" fill="#888888" font-style="italic">Simon 1971; Goldhaber 1997; Wu 2016</text>
<text x="650" y="304" font-size="12.5" fill="#888888" font-weight="600" letter-spacing="1">CAPTURES</text>
<text x="650" y="328" font-size="18" fill="#5A2218" font-weight="600">Focus / waking hours</text>
<text x="930" y="304" font-size="12.5" fill="#888888" font-weight="600" letter-spacing="1">EXIT COST</text>
<text x="930" y="328" font-size="18" fill="#1A1A1A">Very high — compulsion-loop</text>
<text x="930" y="350" font-size="18" fill="#1A1A1A">design</text>
<rect x="480" y="424" width="400" height="48" fill="#5A2218" rx="4"/>
<text x="680" y="455" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0.8">ROW 24 · ATTENTION ECONOMY</text>
<rect x="910" y="424" width="380" height="48" fill="#1F6B5C" rx="4"/>
<text x="1100" y="455" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0.8">A DECLARED CONSTRAINT</text>
<text x="50" y="455" font-size="16" fill="#555555" font-weight="600" letter-spacing="1">THE FOUR TESTS</text>
<rect x="40" y="482" width="1260" height="117" fill="#FFFFFF" rx="4" opacity="0.55"/>
<line x1="40" y1="482" x2="1300" y2="482" stroke="#9F9A8E" stroke-width="0.5" stroke-dasharray="1 4" opacity="0.8"/>
<text x="50" y="516" font-size="21" fill="#1A1A1A" font-weight="600">Declared in advance</text>
<text x="50" y="540" font-size="14.5" fill="#888888" font-style="italic">Is the rule stated before it binds you?</text>
<line x1="494" y1="500" x2="518" y2="524" stroke="#5A2218" stroke-width="5.28" stroke-linecap="round"/>
<line x1="518" y1="500" x2="494" y2="524" stroke="#5A2218" stroke-width="5.28" stroke-linecap="round"/>
<text x="534" y="510" font-size="15.5" fill="#1A1A1A">The engagement objective is never</text>
<text x="534" y="531" font-size="15.5" fill="#1A1A1A">published. You meet it as experience,</text>
<text x="534" y="552" font-size="15.5" fill="#1A1A1A">not as a term you were offered.</text>
<polyline points="924,512.6 933,521 948,502.4" fill="none" stroke="#1F6B5C" stroke-width="5.28" stroke-linecap="round" stroke-linejoin="round"/>
<text x="964" y="510" font-size="15.5" fill="#1A1A1A">Written down and dated before it</text>
<text x="964" y="531" font-size="15.5" fill="#1A1A1A">takes effect. You can read it before</text>
<text x="964" y="552" font-size="15.5" fill="#1A1A1A">you are inside it.</text>
<line x1="40" y1="599" x2="1300" y2="599" stroke="#9F9A8E" stroke-width="0.5" stroke-dasharray="1 4" opacity="0.8"/>
<text x="50" y="633" font-size="21" fill="#1A1A1A" font-weight="600">States what it forbids</text>
<text x="50" y="657" font-size="14.5" fill="#888888" font-style="italic">Does it name the things it rules out?</text>
<line x1="494" y1="617" x2="518" y2="641" stroke="#5A2218" stroke-width="5.28" stroke-linecap="round"/>
<line x1="518" y1="617" x2="494" y2="641" stroke="#5A2218" stroke-width="5.28" stroke-linecap="round"/>
<text x="534" y="627" font-size="15.5" fill="#1A1A1A">It forbids nothing openly. It selects,</text>
<text x="534" y="648" font-size="15.5" fill="#1A1A1A">ranks and rewards — a design, not a rule</text>
<text x="534" y="669" font-size="15.5" fill="#1A1A1A">you could point at.</text>
<polyline points="924,629.6 933,638 948,619.4" fill="none" stroke="#1F6B5C" stroke-width="5.28" stroke-linecap="round" stroke-linejoin="round"/>
<text x="964" y="627" font-size="15.5" fill="#1A1A1A">Its prohibitions are the content.</text>
<text x="964" y="648" font-size="15.5" fill="#1A1A1A">What it rules out is the part you can</text>
<text x="964" y="669" font-size="15.5" fill="#1A1A1A">hold it to.</text>
<rect x="40" y="716" width="1260" height="117" fill="#FFFFFF" rx="4" opacity="0.55"/>
<line x1="40" y1="716" x2="1300" y2="716" stroke="#9F9A8E" stroke-width="0.5" stroke-dasharray="1 4" opacity="0.8"/>
<text x="50" y="750" font-size="21" fill="#1A1A1A" font-weight="600">Inspectable by a non-truster</text>
<text x="50" y="774" font-size="14.5" fill="#888888" font-style="italic">Can a sceptic check it without taking anyone’s</text>
<text x="50" y="793" font-size="14.5" fill="#888888" font-style="italic">word?</text>
<line x1="494" y1="734" x2="518" y2="758" stroke="#5A2218" stroke-width="5.28" stroke-linecap="round"/>
<line x1="518" y1="734" x2="494" y2="758" stroke="#5A2218" stroke-width="5.28" stroke-linecap="round"/>
<text x="534" y="744" font-size="15.5" fill="#1A1A1A">Ranking and experiment assignment are</text>
<text x="534" y="765" font-size="15.5" fill="#1A1A1A">not visible from outside. Trust is the</text>
<text x="534" y="786" font-size="15.5" fill="#1A1A1A">only posture available to you.</text>
<polyline points="924,746.6 933,755 948,736.4" fill="none" stroke="#1F6B5C" stroke-width="5.28" stroke-linecap="round" stroke-linejoin="round"/>
<text x="964" y="744" font-size="15.5" fill="#1A1A1A">Verifiable from outside by someone</text>
<text x="964" y="765" font-size="15.5" fill="#1A1A1A">who assumes bad faith. Checking does</text>
<text x="964" y="786" font-size="15.5" fill="#1A1A1A">not require permission.</text>
<line x1="40" y1="833" x2="1300" y2="833" stroke="#9F9A8E" stroke-width="0.5" stroke-dasharray="1 4" opacity="0.8"/>
<text x="50" y="867" font-size="21" fill="#1A1A1A" font-weight="600">Forkable and exitable</text>
<text x="50" y="891" font-size="14.5" fill="#888888" font-style="italic">Can you leave, or run your own, and keep what you</text>
<text x="50" y="910" font-size="14.5" fill="#888888" font-style="italic">built?</text>
<line x1="494" y1="851" x2="518" y2="875" stroke="#5A2218" stroke-width="5.28" stroke-linecap="round"/>
<line x1="518" y1="851" x2="494" y2="875" stroke="#5A2218" stroke-width="5.28" stroke-linecap="round"/>
<text x="534" y="861" font-size="15.5" fill="#1A1A1A">Exit cost, in the row’s own words: Very</text>
<text x="534" y="882" font-size="15.5" fill="#1A1A1A">high — compulsion-loop design.</text>
<polyline points="924,863.6 933,872 948,853.4" fill="none" stroke="#1F6B5C" stroke-width="5.28" stroke-linecap="round" stroke-linejoin="round"/>
<text x="964" y="861" font-size="15.5" fill="#1A1A1A">Leaving is defined and cheap. A fork</text>
<text x="964" y="882" font-size="15.5" fill="#1A1A1A">carries the same rules, so exit is</text>
<text x="964" y="903" font-size="15.5" fill="#1A1A1A">not exile.</text>
<line x1="40" y1="950" x2="1300" y2="950" stroke="#9F9A8E" stroke-width="1.2"/>
<rect x="480" y="962" width="400" height="68" fill="#5A2218" rx="4" opacity="0.1"/>
<text x="506" y="1010" font-size="38" fill="#5A2218" font-weight="700">0 / 4</text>
<rect x="910" y="962" width="380" height="68" fill="#1F6B5C" rx="4" opacity="0.1"/>
<text x="936" y="1010" font-size="38" fill="#1F6B5C" font-weight="700">4 / 4</text>
<text x="50" y="994" font-size="16" fill="#555555" font-weight="600" letter-spacing="1">SCORE</text>
<text x="50" y="1016" font-size="14" fill="#888888" font-style="italic">the author’s assessment</text>
<text x="50" y="1074" font-size="21" fill="#1A1A1A" font-weight="600">The difference is not how much a thing shapes you. It is whether you could read the terms in advance, see what</text>
<text x="50" y="1102" font-size="21" fill="#1A1A1A" font-weight="600">they rule out, check them yourself, and leave.</text>
<text x="50" y="1144" font-size="16.35" fill="#1A1A1A" font-weight="600">Severity and exit cost are the author’s own interpretive scale, not scholarship — no cited source ranks these phases.</text>
<text x="50" y="1165.58" font-size="16.35" fill="#555555">The citations support each card’s mechanism, not its position on this ramp.</text>
</svg>