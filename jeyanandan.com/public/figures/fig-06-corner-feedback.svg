t="34" rx="8" fill="none" stroke="var(--constraint)" stroke-width="2"/><text x="71" y="61" class="mono" font-size="17" font-weight="700" fill="var(--constraint)" text-anchor="middle">06</text><text x="114" y="62" class="t ttl">Corners become privileged sites</text><text x="114" y="88" class="m sub">A marginal advantage, amplified</text><line x1="44" y1="108" x2="1196" y2="108" stroke="var(--stroke)" stroke-width="1.5"/><circle cx="400.0" cy="308.0" r="9.0" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.9"/><line x1="412.1" y1="303.3" x2="490.9" y2="347.5" stroke="var(--emergence)" stroke-width="2" stroke-linecap="round" opacity="0.75"/><path d="M490.9,347.5 L482.0,346.7 L485.6,340.3 Z" fill="var(--emergence)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><text x="400.0" y="282.0" class="t sm" text-anchor="middle" opacity="1" >tiny asymmetry</text><circle cx="502.2" cy="341.0" r="9.0" fill="var(--topdown)" stroke="none" stroke-width="1.5" opacity="0.9"/><line x1="512.3" y1="349.1" x2="513.4" y2="465.5" stroke="var(--topdown)" stroke-width="2" stroke-linecap="round" opacity="0.75"/><path d="M513.4,465.5 L509.7,457.3 L517.0,457.2 Z" fill="var(--topdown)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><text x="528.2" y="330.0" class="t sm" text-anchor="start" opacity="1" >slight protrusion</text><circle cx="524.7" cy="472.0" r="9.0" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.9"/><line x1="522.7" y1="484.8" x2="400.0" y2="557.0" stroke="var(--emergence)" stroke-width="2" stroke-linecap="round" opacity="0.75"/><path d="M400.0,557.0 L405.2,549.7 L408.9,556.0 Z" fill="var(--emergence)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><text x="550.7" y="491.0" class="t sm" text-anchor="start" opacity="1" >greater vapour access</text><circle cx="400.0" cy="570.0" r="9.0" fill="var(--topdown)" stroke="none" stroke-width="1.5" opacity="0.9"/><line x1="387.9" y1="574.7" x2="241.5" y2="491.5" stroke="var(--topdown)" stroke-width="2" stroke-linecap="round" opacity="0.75"/><path d="M241.5,491.5 L250.5,492.4 L246.8,498.8 Z" fill="var(--topdown)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><text x="400.0" y="604.0" class="t sm" text-anchor="middle" opacity="1" >more attachment</text><circle cx="230.3" cy="498.0" r="9.0" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.9"/><line x1="220.1" y1="489.9" x2="219.0" y2="295.5" stroke="var(--emergence)" stroke-width="2" stroke-linecap="round" opacity="0.75"/><path d="M219.0,295.5 L222.7,303.7 L215.4,303.7 Z" fill="var(--emergence)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><text x="204.3" y="517.0" class="t sm" text-anchor="end" opacity="1" >larger protrusion</text><circle cx="207.7" cy="289.0" r="9.0" fill="var(--topdown)" stroke="none" stroke-width="1.5" opacity="0.9"/><line x1="209.7" y1="276.2" x2="400.0" y2="165.0" stroke="var(--topdown)" stroke-width="2" stroke-linecap="round" opacity="0.75"/><path d="M400.0,165.0 L394.8,172.3 L391.1,166.0 Z" fill="var(--topdown)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><text x="181.8" y="278.0" class="t sm" text-anchor="end" opacity="1" >even greater access</text><text x="400.0" y="405.0" class="t" text-anchor="middle" opacity="1" font-size="46" fill="var(--resonance)">↻</text><rect x="770.0" y="190.0" width="400.0" height="150.0" rx="12" fill="var(--panel)" stroke="var(--emergence)" stroke-width="2" opacity="1" /><text x="790.0" y="224.0" class="xs" text-anchor="start" opacity="1" fill="var(--emergence)" font-weight="700">BOTTOM-UP</text><text x="790.0" y="254.0" class="t sm" text-anchor="start" opacity="1" >Individual molecules attach.</text><text x="790.0" y="280.0" class="m sm" text-anchor="start" opacity="1" >Every event is ordinary</text><text x="790.0" y="304.0" class="m sm" text-anchor="start" opacity="1" >molecular physics.</text><rect x="770.0" y="364.0" width="400.0" height="150.0" rx="12" fill="var(--panel)" stroke="var(--topdown)" stroke-width="2" opacity="1" /><text x="790.0" y="398.0" class="xs" text-anchor="start" opacity="1" fill="var(--topdown)" font-weight="700">TOP-DOWN</text><text x="790.0" y="428.0" class="t sm" text-anchor="start" opacity="1" >Existing geometry sets</text><text x="790.0" y="454.0" class="t sm" text-anchor="start" opacity="1" >where attachment is likely.</text><text x="790.0" y="480.0" class="m sm" text-anchor="start" opacity="1" >No molecule was pushed.</text><text x="970.0" y="556.0" class="xs" text-anchor="middle" opacity="1" fill="var(--resonance)">both, simultaneously</text><text x="620.0" y="674.0" class="m cap" text-anchor="middle" opacity="1" >The macroscopic structure filters the microscopic possibility space.</text></svg>