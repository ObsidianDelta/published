0" stroke="var(--grid)" stroke-width="1"/><line x1="1000" y1="0" x2="1000" y2="700" stroke="var(--grid)" stroke-width="1"/><line x1="1040" y1="0" x2="1040" y2="700" stroke="var(--grid)" stroke-width="1"/><line x1="1080" y1="0" x2="1080" y2="700" stroke="var(--grid)" stroke-width="1"/><line x1="1120" y1="0" x2="1120" y2="700" stroke="var(--grid)" stroke-width="1"/><line x1="1160" y1="0" x2="1160" y2="700" stroke="var(--grid)" stroke-width="1"/><line x1="1200" y1="0" x2="1200" y2="700" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="0" x2="1240" y2="0" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="40" x2="1240" y2="40" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="80" x2="1240" y2="80" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="120" x2="1240" y2="120" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="160" x2="1240" y2="160" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="200" x2="1240" y2="200" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="240" x2="1240" y2="240" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="280" x2="1240" y2="280" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="320" x2="1240" y2="320" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="360" x2="1240" y2="360" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="400" x2="1240" y2="400" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="440" x2="1240" y2="440" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="480" x2="1240" y2="480" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="520" x2="1240" y2="520" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="560" x2="1240" y2="560" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="600" x2="1240" y2="600" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="640" x2="1240" y2="640" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="680" x2="1240" y2="680" stroke="var(--grid)" stroke-width="1"/></g><rect x="44" y="38" width="54" height="34" rx="8" fill="none" stroke="var(--constraint)" stroke-width="2"/><text x="71" y="61" class="mono" font-size="17" font-weight="700" fill="var(--constraint)" text-anchor="middle">14</text><text x="114" y="62" class="t ttl">Noise is not the enemy</text><text x="114" y="88" class="m sub">Tight physics applied recursively to microscopic difference</text><line x1="44" y1="108" x2="1196" y2="108" stroke="var(--stroke)" stroke-width="1.5"/><text x="300.0" y="172.0" class="f xs" text-anchor="middle" opacity="1" >PERFECT SYMMETRY</text><polygon points="300.0,388.0 223.8,344.0 223.8,256.0 300.0,212.0 376.2,256.0 376.2,344.0" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linejoin="round" opacity="1"/><line x1="300.0" y1="388.0" x2="300.0" y2="422.0" stroke="var(--faint)" stroke-width="2.4" stroke-linecap="round" opacity="1"/><line x1="223.8" y1="344.0" x2="194.3" y2="361.0" stroke="var(--faint)" stroke-width="2.4" stroke-linecap="round" opacity="1"/><line x1="223.8" y1="256.0" x2="194.3" y2="239.0" stroke="var(--faint)" stroke-width="2.4" stroke-linecap="round" opacity="1"/><line x1="300.0" y1="212.0" x2="300.0" y2="178.0" stroke="var(--faint)" stroke-width="2.4" stroke-linecap="round" opacity="1"/><line x1="376.2" y1="256.0" x2="405.7" y2="239.0" stroke="var(--faint)" stroke-width="2.4" stroke-linecap="round" opacity="1"/><line x1="376.2" y1="344.0" x2="405.7" y2="361.0" stroke="var(--faint)" stroke-width="2.4" stroke-linecap="round" opacity="1"/><text x="300.0" y="430.0" class="m sm" text-anchor="middle" opacity="1" >no reason to branch one way</text><text x="300.0" y="454.0" class="m sm" text-anchor="middle" opacity="1" >rather than another</text><text x="300.0" y="492.0" class="xs" text-anchor="middle" opacity="1" fill="var(--forbidden)">something must break the tie</text><text x="640.0" y="194.0" class="t sm" text-anchor="start" opacity="1" >microscopic noise</text><rect x="640.0" y="204.0" width="460.0" height="16.0" rx="8" fill="none" stroke="var(--stroke)" stroke-width="1.2" opacity="1" /><rect x="640.0" y="204.0" width="46.0" height="16.0" rx="8" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.75" /><text x="640.0" y="260.0" class="t sm" text-anchor="start" opacity="1" >tiny asymmetry</text><rect x="640.0" y="270.0" width="460.0" height="16.0" rx="8" fill="none" stroke="var(--stroke)" stroke-width="1.2" opacity="1" /><rect x="640.0" y="270.0" width="101.2" height="16.0" rx="8" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.75" /><text x="640.0" y="326.0" class="t sm" text-anchor="start" opacity="1" >amplified by feedback</text><rect x="640.0" y="336.0" width="460.0" height="16.0" rx="8" fill="none" stroke="var(--stroke)" stroke-width="1.2" opacity="1" /><rect x="640.0" y="336.0" width="211.6" height="16.0" rx="8" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.75" /><text x="640.0" y="392.0" class="t sm" text-anchor="start" opacity="1" >macroscopic difference</text><rect x="640.0" y="402.0" width="460.0" height="16.0" rx="8" fill="none" stroke="var(--stroke)" stroke-width="1.2" opacity="1" /><rect x="640.0" y="402.0" width="340.4" height="16.0" rx="8" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.75" /><text x="640.0" y="458.0" class="t sm" text-anchor="start" opacity="1" >permanent feature</text><rect x="640.0" y="468.0" width="460.0" height="16.0" rx="8" fill="none" stroke="var(--stroke)" stroke-width="1.2" opacity="1" /><rect x="640.0" y="468.0" width="460.0" height="16.0" rx="8" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.75" /><line x1="1120.0" y1="200.0" x2="1120.0" y2="470.0" stroke="var(--emergence)" stroke-width="2.4" stroke-linecap="round" opacity="1"/><path d="M1120.0,470.0 L1116.3,461.8 L1123.7,461.8 Z" fill="var(--emergence)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="1136.0" y="340.0" class="xs" text-anchor="start" opacity="1" fill="var(--emergence)">amplification</text><rect x="80.0" y="542.0" width="1080.0" height="98.0" rx="12" fill="var(--panel)" stroke="var(--stroke)" stroke-width="1.5" opacity="1" /><text x="104.0" y="578.0" class="xs" text-anchor="start" opacity="1" fill="var(--constraint)" font-weight="700">DETERMINISM AT THE BOTTOM</text><text x="104.0" y="606.0" class="m sm" text-anchor="start" opacity="1" >the physics is extremely tight</text><line x1="620.0" y1="560.0" x2="620.0" y2="622.0" stroke="var(--stroke)" stroke-width="1.5" stroke-linecap="round" opacity="1"/><text x="648.0" y="578.0" class="xs" text-anchor="start" opacity="1" fill="var(--emergence)" font-weight="700">UNREPEATABILITY AT THE TOP</text><text x="648.0" y="606.0" class="m sm" text-anchor="start" opacity="1" >no two snowflakes alike — both true, no contradiction</text><text x="620.0" y="674.0" class="m cap" text-anchor="middle" opacity="1" >Noise is not degradation of the pattern. It is the seed material the constraint regime works on.</text></svg>