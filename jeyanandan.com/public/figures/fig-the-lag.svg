<text x="50" y="1070" font-size="18" fill="#555555" font-style="italic">Twenty-seven centuries, then five centuries, then four, then forty-four years — and then the line is crossed. Rows 24 and 26 were named by sources</text>
<text x="50" y="1095" font-size="18" fill="#555555" font-style="italic">that predate their build-out. That is the finding, not an error in the dating: by the most recent rows the description arrives before or alongside</text>
<text x="50" y="1120" font-size="18" fill="#555555" font-style="italic">the thing it describes. The lag is what used to protect you, and it is gone.</text>
<text x="50" y="1161" font-size="18.06" fill="#1A1A1A" font-weight="600">Severity and exit cost are the author’s own interpretive scale, not scholarship — no cited source ranks these phases.</text>
<text x="50" y="1184.83" font-size="18.06" fill="#555555">The citations support each card’s mechanism, not its position on this ramp.</text>
