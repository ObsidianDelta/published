<text x="60" y="1189" font-size="16.5" fill="#555555" font-style="italic">The horizontal ordering is a classification of the captures column, not something the diagram states. Row 16 sits far to the</text>
<text x="60" y="1212" font-size="16.5" fill="#555555" font-style="italic">left at the top of the vertical: enclosure took the body and left no exit. That is the exception, and it is why this is not a</text>
<text x="60" y="1235" font-size="16.5" fill="#555555" font-style="italic">ladder anyone climbed.</text>
<text x="60" y="1272" font-size="14.64" fill="#1A1A1A" font-weight="600">Severity and exit cost are the author’s own interpretive scale, not scholarship — no cited source ranks these phases.</text>
<text x="60" y="1291.32" font-size="14.64" fill="#555555">The citations support each card’s mechanism, not its position on this ramp.</text>
