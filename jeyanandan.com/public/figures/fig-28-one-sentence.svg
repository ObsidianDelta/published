t="34" rx="8" fill="none" stroke="var(--constraint)" stroke-width="2"/><text x="71" y="61" class="mono" font-size="17" font-weight="700" fill="var(--constraint)" text-anchor="middle">28</text><text x="114" y="62" class="t ttl">The one sentence</text><text x="114" y="88" class="m sub">If everything else were stripped away</text><line x1="44" y1="108" x2="1196" y2="108" stroke="var(--stroke)" stroke-width="1.5"/><rect x="80.0" y="150.0" width="1080.0" height="148.0" rx="14" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.12" /><rect x="80.0" y="150.0" width="1080.0" height="148.0" rx="14" fill="none" stroke="var(--emergence)" stroke-width="2.6" opacity="1" /><text x="620.0" y="202.0" class="t" text-anchor="middle" opacity="1" font-size="22" font-weight="700">Emergence is the formation of a new constraint regime,</text><text x="620.0" y="238.0" class="t" text-anchor="middle" opacity="1" font-size="22" font-weight="700">and top-down causation is the subsequent influence of that regime</text><text x="620.0" y="274.0" class="t" text-anchor="middle" opacity="1" font-size="22" font-weight="700">on the lower-level possibilities from which further emergence occurs.</text><rect x="92.0" y="346.0" width="169.6" height="44.0" rx="8" fill="var(--constraint)" stroke="none" stroke-width="1.5" opacity="0.16" /><rect x="92.0" y="346.0" width="169.6" height="44.0" rx="8" fill="none" stroke="var(--constraint)" stroke-width="1.8" opacity="1" /><text x="176.8" y="373.0" class="t sm" text-anchor="middle" opacity="1" >molecular constraints</text><text x="266.6" y="373.0" class="f" text-anchor="middle" opacity="1" font-size="13">→</text><rect x="271.6" y="346.0" width="63.2" height="44.0" rx="8" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.16" /><rect x="271.6" y="346.0" width="63.2" height="44.0" rx="8" fill="none" stroke="var(--emergence)" stroke-width="1.8" opacity="1" /><text x="303.2" y="373.0" class="t sm" text-anchor="middle" opacity="1" >crystal</text><text x="339.8" y="373.0" class="f" text-anchor="middle" opacity="1" font-size="13">→</text><rect x="344.8" y="346.0" width="177.2" height="44.0" rx="8" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.16" /><rect x="344.8" y="346.0" width="177.2" height="44.0" rx="8" fill="none" stroke="var(--emergence)" stroke-width="1.8" opacity="1" /><text x="433.4" y="373.0" class="t sm" text-anchor="middle" opacity="1" >hexagonal organisation</text><text x="527.0" y="373.0" class="f" text-anchor="middle" opacity="1" font-size="13">→</text><rect x="532.0" y="346.0" width="101.2" height="44.0" rx="8" fill="var(--topdown)" stroke="none" stroke-width="1.5" opacity="0.16" /><rect x="532.0" y="346.0" width="101.2" height="44.0" rx="8" fill="none" stroke="var(--topdown)" stroke-width="1.8" opacity="1" /><text x="582.6" y="373.0" class="t sm" text-anchor="middle" opacity="1" >new geometry</text><text x="638.2" y="373.0" class="f" text-anchor="middle" opacity="1" font-size="13">→</text><rect x="643.2" y="346.0" width="177.2" height="44.0" rx="8" fill="var(--constraint)" stroke="none" stroke-width="1.5" opacity="0.16" /><rect x="643.2" y="346.0" width="177.2" height="44.0" rx="8" fill="none" stroke="var(--constraint)" stroke-width="1.8" opacity="1" /><text x="731.8" y="373.0" class="t sm" text-anchor="middle" opacity="1" >new vapour constraints</text><text x="825.4" y="373.0" class="f" text-anchor="middle" opacity="1" font-size="13">→</text><rect x="830.4" y="346.0" width="70.8" height="44.0" rx="8" fill="var(--emergence)" stroke="none" stroke-width="1.5" opacity="0.16" /><rect x="830.4" y="346.0" width="70.8" height="44.0" rx="8" fill="none" stroke="var(--emergence)" stroke-width="1.8" opacity="1" /><text x="865.8" y="373.0" class="t sm" text-anchor="middle" opacity="1" >branches</text><text x="906.2" y="373.0" class="f" text-anchor="middle" opacity="1" font-size="13">→</text><rect x="911.2" y="346.0" width="200.0" height="44.0" rx="8" fill="var(--constra