.6" stroke-linecap="round" opacity="1"/><circle cx="700.0" cy="446.0" r="6.0" fill="var(--topdown)" stroke="none" stroke-width="1.5" opacity="1"/><text x="724.0" y="451.0" class="t sm" text-anchor="start" opacity="1" >tips receive relatively more</text><line x1="700.0" y1="456.0" x2="700.0" y2="490.0" stroke="var(--stroke)" stroke-width="1.6" stroke-linecap="round" opacity="1"/><circle cx="700.0" cy="510.0" r="6.0" fill="var(--muted)" stroke="none" stroke-width="1.5" opacity="1"/><text x="724.0" y="515.0" class="t sm" text-anchor="start" opacity="1" >tips grow further outward</text><path d="M700,516 C640,574 640,150 694,174" fill="none" stroke="var(--resonance)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 5"/><line x1="688.0" y1="168.0" x2="698.0" y2="178.0" stroke="var(--resonance)" stroke-width="2.4" stroke-linecap="round" opacity="1"/><path d="M698.0,178.0 L689.6,174.8 L694.8,169.6 Z" fill="var(--resonance)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="660.0" y="566.0" width="500.0" height="74.0" rx="10" fill="var(--panel)" stroke="var(--resonance)" stroke-width="2" opacity="1" /><text x="684.0" y="596.0" class="t sm" text-anchor="start" opacity="1" >It is not merely growing faster at the tips.</text><text x="684.0" y="622.0" class="t lbl" text-anchor="start" opacity="1" >It is suppressing its own interior, by existing.</text><text x="620.0" y="674.0" class="m cap" text-anchor="middle" opacity="1" >No valuation, no closure, no stake — it merely persists and reshapes what comes next. Hold that for figure 24.</text></svg>