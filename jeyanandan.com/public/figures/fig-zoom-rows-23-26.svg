<text x="1040" y="445.6" font-size="24" fill="#1A1A1A">Predictive</text>
<text x="1040" y="476.8" font-size="24" fill="#1A1A1A">personalization. LLM-</text>
<text x="1040" y="508" font-size="24" fill="#1A1A1A">mediated search</text>
<text x="1040" y="539.2" font-size="24" fill="#1A1A1A">shapes desire BEFORE</text>
<text x="1040" y="570.4" font-size="24" fill="#1A1A1A">articulation.</text>
<text x="1040" y="620.8" font-size="19.2" fill="#888888" font-weight="600" letter-spacing="1.68">CAPTURES</text>
<text x="1040" y="652" font-size="24" fill="#3A1010" font-weight="600">Pre-conscious want</text>
