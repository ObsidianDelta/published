<text x="1040" y="731.2" font-size="24" fill="#1A1A1A">Extreme — shaping is</text>
<text x="1040" y="760" font-size="24" fill="#1A1A1A">invisible</text>
<text x="1040" y="812.8" font-size="21.6" fill="#888888" font-style="italic">Yeung 2017</text>
