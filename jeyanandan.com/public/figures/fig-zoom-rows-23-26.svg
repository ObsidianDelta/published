<text x="716" y="335.2" font-size="31.2" fill="#1A1A1A" font-weight="700">Algorithmic</text>
<text x="716" y="373.6" font-size="31.2" fill="#1A1A1A" font-weight="700">curation</text>
<text x="716" y="426.4" font-size="21.6" fill="#888888" font-weight="500" letter-spacing="1.2">MOBILE ERA</text>
<line x1="716" y1="450.4" x2="980" y2="450.4" stroke="#9F9A8E" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="716" y="484" font-size="24" fill="#1A1A1A">Recommendation</text>
<text x="716" y="515.2" font-size="24" fill="#1A1A1A">engines shape the</text>
<text x="716" y="546.4" font-size="24" fill="#1A1A1A">information diet. The</text>
<text x="716" y="577.6" font-size="24" fill="#1A1A1A">strong 'filter</text>
<text x="716" y="608.8" font-size="24" fill="#1A1A1A">bubble' claim is not</text>
<text x="716" y="640" font-size="24" fill="#1A1A1A">supported: ranking</text>
<text x="716" y="671.2" font-size="24" fill="#1A1A1A">slightly widens news</text>
<text x="716" y="702.4" font-size="24" fill="#1A1A1A">diets; self-selection</text>
<text x="716" y="733.6" font-size="24" fill="#1A1A1A">builds echo chambers.</text>
<text x="716" y="784" font-size="19.2" fill="#888888" font-weight="600" letter-spacing="1.68">CAPTURES</text>
<text x="716" y="815.2" font-size="24" fill="#5A2218" font-weight="600">What is even seen</text>
<text x="716" y="863.2" font-size="19.2" fill="#888888" font-weight="600" letter-spacing="1.68">EXIT COST</text>
<text x="716" y="894.4" font-size="24" fill="#1A1A1A">Very high — the unseen</text>
<text x="716" y="923.2" font-size="24" fill="#1A1A1A">is unknowable</text>
<text x="716" y="976" font-size="21.6" fill="#888888" font-style="italic">Pariser 2011 (since</text>
<text x="716" y="1002.4" font-size="21.6" fill="#888888" font-style="italic">contested); Eubanks</text>
<text x="716" y="1028.8" font-size="21.6" fill="#888888" font-style="italic">2018</text>
