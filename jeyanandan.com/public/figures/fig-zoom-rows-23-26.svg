<text x="44" y="1356" font-size="17.5" fill="#555555" font-style="italic">Discoverability is a condition on being found. Waking hours are a quantity of life. What is even seen is the boundary of the visible. A pre-</text>
<text x="44" y="1380" font-size="17.5" fill="#555555" font-style="italic">conscious want is the thing that decides before you do. Four rows, and the target moves from outside you to underneath you.</text>
<text x="44" y="1422" font-size="16.74" fill="#1A1A1A" font-weight="600">Severity and exit cost are the author’s own interpretive scale, not scholarship — no cited source ranks these phases.</text>
<text x="44" y="1444.09" font-size="16.74" fill="#555555">The citations support each card’s mechanism, not its position on this ramp.</text>
