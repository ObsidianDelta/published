<text x="392" y="445.6" font-size="24" fill="#1A1A1A">Engagement metrics,</text>
<text x="392" y="476.8" font-size="24" fill="#1A1A1A">infinite scroll,</text>
<text x="392" y="508" font-size="24" fill="#1A1A1A">variable-reward</text>
<text x="392" y="539.2" font-size="24" fill="#1A1A1A">loops. Cognitive</text>
<text x="392" y="570.4" font-size="24" fill="#1A1A1A">enclosure.</text>
