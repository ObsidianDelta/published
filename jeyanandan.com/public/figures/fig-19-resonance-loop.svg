<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img"><style>
:root{
  --bg:#080d17; --panel:#0e1524; --grid:#162034;
  --fg:#e9eff8; --muted:#8ea4c4; --faint:#4a5f80;
  --constraint:#38d8f0; --constraint-dim:#0d5566;
