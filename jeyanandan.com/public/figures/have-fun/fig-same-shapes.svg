</g>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="var(--resonance)"/>
</marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
</marker>
</defs>
<text x="60" y="70" class="t ttl">The same shapes, fifteen years apart</text>
<text x="60" y="102" class="m sub">A different domain. The same instinct.</text>
<text x="60" y="174" class="xs" style="fill:var(--history)">THEN · ALLCHARITIES.ORG AND 1CLICK1LIFE · 2004–2021</text>
<text x="710" y="174" class="xs" style="fill:var(--constraint)">NOW · WHAT I AM BUILDING · 2026</text>
<rect x="60" y="200" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--history)" stroke-width="1.3"/>
<rect x="710" y="200" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.3"/>
<text x="78" y="226.5" class="t body">Four parties, each with declared responsibilities, and a</text>
<text x="78" y="245.0" class="t body">party in the middle that holds the integrity</text>
<text x="728" y="226.5" class="t body">The Constraint Protocol: declare in advance what you</text>
<text x="728" y="245.0" class="t body">will not do, and anyone can check you against it</text>
<line x1="540" y1="232.0" x2="700" y2="232.0" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="278" width="470" height="81.5" rx="10" fill="var(--panel)" stroke="var(--history)" stroke-width="1.3"/>
<rect x="710" y="278" width="470" height="81.5" rx="10" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.3"/>
<text x="78" y="313.2" class="t body">1Click1Life in the middle, apart from the businesses</text>
<text x="78" y="331.8" class="t body">that sponsored it</text>
<text x="728" y="304.0" class="t body">The DAX Foundation holds the constraint; Obsidian Delta</text>
<text x="728" y="322.5" class="t body">builds. A company should not also hold the constraint it</text>
<text x="728" y="341.0" class="t body">commits to</text>
<line x1="540" y1="318.75" x2="700" y2="318.75" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="373.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--history)" stroke-width="1.3"/>
<rect x="710" y="373.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.3"/>
<text x="78" y="400.0" class="t body">“At no times do we take money.” Every dollar from a</text>
<text x="78" y="418.5" class="t body">business to be posted publicly</text>
<text x="728" y="400.0" class="t body">A record that cannot be quietly edited, and publishing</text>
<text x="728" y="418.5" class="t body">with every change visible</text>
<line x1="540" y1="405.5" x2="700" y2="405.5" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="451.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--history)" stroke-width="1.3"/>
<rect x="710" y="451.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.3"/>
<text x="78" y="487.2" class="t body">Win-win-win: nobody has to lose</text>
<text x="728" y="478.0" class="t body">Knowledge and reasoning that compound across parties</text>
<text x="728" y="496.5" class="t body">instead of resetting each time two of them meet</text>
<line x1="540" y1="483.5" x2="700" y2="483.5" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="529.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--history)" stroke-width="1.3"/>
<rect x="710" y="529.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.3"/>
<text x="78" y="556.0" class="t body">The clue locked behind the charity’s own page: learning</text>
<text x="78" y="574.5" class="t body">as the way in</text>
<text x="728" y="556.0" class="t body">Meta DAX: learning for every human being, always a way</text>
<text x="728" y="574.5" class="t body">and never the way</text>
<line x1="540" y1="561.5" x2="700" y2="561.5" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="607.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--history)" stroke-width="1.3"/>
<rect x="710" y="607.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.3"/>
<text x="78" y="643.2" class="t body">Apathy, answered with something only you could do</text>
<text x="728" y="634.0" class="t body">Human delta value: what a person brings, and what they</text>
<text x="728" y="652.5" class="t body">do with what they are given</text>
<line x1="540" y1="639.5" x2="700" y2="639.5" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="685.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--history)" stroke-width="1.3"/>
<rect x="710" y="685.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.3"/>
<text x="78" y="721.2" class="t body">Synergy: every party more together than apart</text>
<text x="728" y="712.0" class="t body">A person and their companion: one unit, only as strong</text>
<text x="728" y="730.5" class="t body">as the human’s best</text>
<line x1="540" y1="717.5" x2="700" y2="717.5" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="763.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--history)" stroke-width="1.3"/>
<rect x="710" y="763.5" width="470" height="64" rx="10" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.3"/>
<text x="78" y="799.2" class="t body">One click, one life</text>
<text x="728" y="790.0" class="t body">DAX: the preservation and expansion of life, humanity,</text>
<text x="728" y="808.5" class="t body">and consciousness. Life is the first word</text>
<line x1="540" y1="795.5" x2="700" y2="795.5" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<text x="60" y="877" class="m cap">Nothing on the left was technical. The shapes are the same.</text>
</svg>