<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 907" width="1240" height="907" role="img" aria-labelledby="t2 d2">
<title id="t2">The same shapes, fifteen years apart</title>
<desc id="d2">Eight rows. On the left, what 1Click1Life and AllCharities.org were trying to do between 2004 and 2021; on the right, where each of those shapes is in 2026: the Constraint Protocol, the DAX Foundation apart from Obsidian Delta, a record that cannot be quietly edited, compounding across parties, Meta DAX, human delta value, the person and companion as one unit, and the DAX constraint.</desc>
<style>
:root{
  --bg:#080d17; --panel:#0e1524; --grid:#162034;
  --fg:#e9eff8; --muted:#8ea4c4; --faint:#4a5f80;
  --constraint:#38d8f0; --constraint-dim:#0d5566;
  --emergence:#ffb340;  --emergence-dim:#6b4413;
  --topdown:#b98cff;    --topdown-dim:#3d2a63;
  --resonance:#3ee6b0;  --resonance-dim:#0f5744;
  --forbidden:#ff5f6d;  --forbidden-dim:#5c1f25;
  --history:#f0d9a8;    --history-dim:#4a3d22;
  --stroke:#243352;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#ffffff; --panel:#f4f7fc; --grid:#e3eaf5;
    --fg:#0c1526; --muted:#4a5f80; --faint:#9fb0c9;
    --constraint:#0090ad; --constraint-dim:#bfeaf3;
    --emergence:#b26a00;  --emergence-dim:#ffe6bd;
    --topdown:#6c3fd1;    --topdown-dim:#e6dcff;
    --resonance:#00916c;  --resonance-dim:#c7f4e6;
    --forbidden:#c8202f;  --forbidden-dim:#ffd9dc;
    --history:#7a5c22;    --history-dim:#f3e6c8;
    --stroke:#c5d2e6;
  }
}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.t{fill:var(--fg)} .m{fill:var(--muted)} .f{fill:var(--faint)}
.ttl{font-size:30px;font-weight:700;letter-spacing:-.3px}
.sub{font-size:17px}
.lbl{font-size:16px;font-weight:650}
.body{font-size:14.5px}
.sm{font-size:13px}
.xs{font-size:11.5px;letter-spacing:.6px;font-weight:600}
.cap{font-size:15px;font-style:italic}
</style>
