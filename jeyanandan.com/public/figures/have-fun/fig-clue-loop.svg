<line x1="520" y1="0" x2="520" y2="790" stroke="var(--grid)" stroke-width="1"/>
<line x1="560" y1="0" x2="560" y2="790" stroke="var(--grid)" stroke-width="1"/>
<line x1="600" y1="0" x2="600" y2="790" stroke="var(--grid)" stroke-width="1"/>
