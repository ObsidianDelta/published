<line x1="680" y1="0" x2="680" y2="790" stroke="var(--grid)" stroke-width="1"/>
<line x1="720" y1="0" x2="720" y2="790" stroke="var(--grid)" stroke-width="1"/>
<line x1="760" y1="0" x2="760" y2="790" stroke="var(--grid)" stroke-width="1"/>
<line x1="800" y1="0" x2="800" y2="790" stroke="var(--grid)" stroke-width="1"/>
<line x1="840" y1="0" x2="840" y2="790" stroke="var(--grid)" stroke-width="1"/>
