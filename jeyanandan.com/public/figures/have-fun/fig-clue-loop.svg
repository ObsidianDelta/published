<line x1="0" y1="760" x2="1240" y2="760" stroke="var(--grid)" stroke-width="1"/>
</g>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="var(--resonance)"/>
</marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
</marker>
</defs>
<text x="60" y="70" class="t ttl">How one clue worked</text>
<text x="60" y="102" class="m sub">AllCharities.org and 1Click1Life, as demonstrated in August 2021</text>
<rect x="60" y="150" width="300" height="158" rx="12" fill="var(--panel)" stroke="var(--emergence)" stroke-width="1.6"/>
<circle cx="86" cy="178" r="14" fill="var(--emergence-dim)" stroke="var(--emergence)" stroke-width="1.4"/>
<text x="86" y="183" text-anchor="middle" class="t sm" style="font-weight:700">1</text>
<text x="110" y="183.0" class="t lbl">A business reposts the clue</text>
<text x="110" y="202.0" class="t lbl">post</text>
<text x="78" y="227.0" class="m body">It follows AllCharities.org and</text>
<text x="78" y="245.5" class="m body">shares each clue with its own</text>
<text x="78" y="264.0" class="m body">followers. Its feed becomes part</text>
<text x="78" y="282.5" class="m body">of the game.</text>
<rect x="470" y="150" width="300" height="158" rx="12" fill="var(--panel)" stroke="var(--emergence)" stroke-width="1.6"/>
<circle cx="496" cy="178" r="14" fill="var(--emergence-dim)" stroke="var(--emergence)" stroke-width="1.4"/>
<text x="496" y="183" text-anchor="middle" class="t sm" style="font-weight:700">2</text>
<text x="520" y="183.0" class="t lbl">One click</text>
<text x="488" y="208.0" class="m body">You follow a charity, a sponsor or</text>
<text x="488" y="226.5" class="m body">1Click1Life, and the next post you</text>
<text x="488" y="245.0" class="m body">see is a clue.</text>
<rect x="880" y="150" width="300" height="158" rx="12" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.6"/>
<circle cx="906" cy="178" r="14" fill="var(--constraint-dim)" stroke="var(--constraint)" stroke-width="1.4"/>
<text x="906" y="183" text-anchor="middle" class="t sm" style="font-weight:700">3</text>
<text x="930" y="183.0" class="t lbl">The post on</text>
<text x="930" y="202.0" class="t lbl">AllCharities.org</text>
<text x="898" y="227.0" class="m body">What the charity does, in plain</text>
<text x="898" y="245.5" class="m body">words, and one question. The clue</text>
<text x="898" y="264.0" class="m body">is locked behind it.</text>
<rect x="880" y="430" width="300" height="158" rx="12" fill="var(--panel)" stroke="var(--constraint)" stroke-width="1.6"/>
<circle cx="906" cy="458" r="14" fill="var(--constraint-dim)" stroke="var(--constraint)" stroke-width="1.4"/>
<text x="906" y="463" text-anchor="middle" class="t sm" style="font-weight:700">4</text>
<text x="930" y="463.0" class="t lbl">The charity's own website</text>
<text x="898" y="488.0" class="m body">You go and find the answer: what</text>
<text x="898" y="506.5" class="m body">they are doing right now. In the</text>
<text x="898" y="525.0" class="m body">demo: World Vision Canada, helping</text>
<text x="898" y="543.5" class="m body">Haiti after the earthquake.</text>
<rect x="470" y="430" width="300" height="158" rx="12" fill="var(--panel)" stroke="var(--topdown)" stroke-width="1.6"/>
<circle cx="496" cy="458" r="14" fill="var(--topdown-dim)" stroke="var(--topdown)" stroke-width="1.4"/>
<text x="496" y="463" text-anchor="middle" class="t sm" style="font-weight:700">5</text>
<text x="520" y="463.0" class="t lbl">Type the answer; the clue</text>
<text x="520" y="482.0" class="t lbl">appears</text>
<text x="488" y="507.0" class="m body">Right answer, and the clue to the</text>
<text x="488" y="525.5" class="m body">treasure is revealed. In the demo:</text>
<text x="488" y="544.0" class="m body">“We the North.”</text>
<rect x="60" y="430" width="300" height="158" rx="12" fill="var(--panel)" stroke="var(--topdown)" stroke-width="1.6"/>
<circle cx="86" cy="458" r="14" fill="var(--topdown-dim)" stroke="var(--topdown)" stroke-width="1.4"/>
<text x="86" y="463" text-anchor="middle" class="t sm" style="font-weight:700">6</text>
<text x="110" y="463.0" class="t lbl">Solve the riddles with</text>
<text x="110" y="482.0" class="t lbl">friends</text>
<text x="78" y="507.0" class="m body">Clue by clue, campaign by</text>
<text x="78" y="525.5" class="m body">campaign. Get there first and the</text>
<text x="78" y="544.0" class="m body">treasure is yours. The demo pot:</text>
<text x="78" y="562.5" class="m body">$500.</text>
<line x1="368" y1="229.0" x2="462" y2="229.0" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<line x1="778" y1="229.0" x2="872" y2="229.0" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<line x1="1030.0" y1="316" x2="1030.0" y2="422" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<line x1="872" y1="509.0" x2="778" y2="509.0" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<line x1="462" y1="509.0" x2="368" y2="509.0" stroke="var(--resonance)" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 100 422 L 100 316" fill="none" stroke="var(--resonance)" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah)"/>
<text x="114" y="374.0" class="m sm">next clue</text>
<text x="1016.0" y="374.0" text-anchor="end" class="m sm">learning is the price of the clue</text>
<text x="60" y="632" class="f xs">WHO WINS, EACH TIME THE LOOP RUNS</text>
<rect x="60" y="646" width="270" height="78" rx="10" fill="var(--constraint-dim)" opacity="0.55"/>
<text x="76" y="672" class="t lbl">The charity</text>
<text x="76" y="694.0" class="t body">a visitor who now knows what it</text>
<text x="76" y="712.0" class="t body">does, and a way to act</text>
<rect x="350" y="646" width="270" height="78" rx="10" fill="var(--emergence-dim)" opacity="0.55"/>
<text x="366" y="672" class="t lbl">The business</text>
<text x="366" y="694.0" class="t body">a new follower, and its name</text>
<text x="366" y="712.0" class="t body">next to a cause</text>
<rect x="640" y="646" width="270" height="78" rx="10" fill="var(--topdown-dim)" opacity="0.55"/>
<text x="656" y="672" class="t lbl">You</text>
<text x="656" y="694.0" class="t body">one true thing learned, and a</text>
<text x="656" y="712.0" class="t body">real shot at the treasure</text>
<rect x="930" y="646" width="270" height="78" rx="10" fill="var(--resonance-dim)" opacity="0.55"/>
<text x="946" y="672" class="t lbl">The media</text>
<text x="946" y="694.0" class="t body">content worth running</text>
<text x="60" y="766" class="m cap">Donations were to be made on the charity’s own page. 1Click1Life and AllCharities.org would never accept one.</text>
</svg>