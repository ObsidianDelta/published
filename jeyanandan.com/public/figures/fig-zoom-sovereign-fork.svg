<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1670.38" width="1120" height="1670.38" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="1670.38" fill="#FAF7F0"/>
<line x1="26" y1="16" x2="1094" y2="16" stroke="#B5AE9C" stroke-width="1"/>
<line x1="26" y1="1654.38" x2="1094" y2="1654.38" stroke="#B5AE9C" stroke-width="1"/>
<defs><marker id="sovdown" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1F6B5C"/></marker></defs>
<text x="560" y="45.36" font-size="33.6" fill="#1A1A1A" font-weight="600" text-anchor="middle">The sovereign fork</text>
<text x="560" y="78.34" font-size="21.28" fill="#555555" text-anchor="middle" font-style="italic">Rows 29 to 31 — architectural legibility, sovereign meaning-making, open meaning commons</text>
<text x="560" y="103.52" font-size="16.24" fill="#888888" text-anchor="middle">Detail of The Genealogy of Meaning Capture · the post-recognition track</text>
<text x="60" y="200" font-size="20" fill="#1F6B5C" font-weight="600" letter-spacing="0.8">THE SOVEREIGN FORK</text>
<text x="60" y="226" font-size="15" fill="#1F6B5C" font-style="italic">Available at any phase — activates upon architectural legibility</text>
<text x="60" y="254" font-size="14.5" fill="#555555">The fork is not a 32nd phase in time. It is a property that activates the moment</text>
<text x="60" y="274" font-size="14.5" fill="#555555">a subject sees the architecture AS architecture. Capture rows describe the default;</text>
<text x="60" y="294" font-size="14.5" fill="#555555">fork rows describe the alternative available to anyone who recognizes the stack.</text>
<text x="60" y="322" font-size="14.5" fill="#555555" font-style="italic">“Meaning, in this framework, is not deliverable. It arrives through suffered-for resistance.”</text>
<rect x="38" y="338" width="1044" height="1144.34" fill="#E5F1ED" stroke="#7FB8AC" stroke-width="0.8" rx="10" fill-opacity="0.5"/>
<rect x="60" y="356" width="1000" height="306.17" fill="#FFFFFF" stroke="#1F6B5C" stroke-width="2.14" rx="8.57"/>
<circle cx="102.86" cy="398.86" r="28.57" fill="#1F6B5C"/>
<text x="102.86" y="407.43" font-size="22.86" fill="white" font-weight="600" text-anchor="middle">29</text>
<text x="148.57" y="394.57" font-size="25.71" fill="#1A1A1A" font-weight="600">Architectural legibility</text>
<text x="148.57" y="420.29" font-size="15.71" fill="#888888" font-style="italic">post-recognition (any phase)</text>
<line x1="81.43" y1="444.57" x2="1038.57" y2="444.57" stroke="#7FB8AC" stroke-width="0.71"/>
<text x="81.43" y="473.14" font-size="17.14" fill="#1A1A1A">The capture mechanisms become visible AS mechanisms. The trance breaks for that subject. The fork can</text>
<text x="81.43" y="496.11" font-size="17.14" fill="#1A1A1A">activate at any historical phase, including this one.</text>
<text x="81.43" y="539.09" font-size="14.29" fill="#888888" font-weight="600" letter-spacing="0.71">CAPTURES (or rather: AUTHORS)</text>
<text x="81.43" y="560.51" font-size="15.71" fill="#1F6B5C" font-weight="500">First uncaptured choice</text>
<text x="81.43" y="594.91" font-size="14.29" fill="#888888" font-weight="600" letter-spacing="0.71">EXIT COST</text>
<text x="81.43" y="616.34" font-size="15.71" fill="#1A1A1A">n/a — recognition IS the exit</text>
<line x1="560" y1="676.17" x2="560" y2="712.17" stroke="#1F6B5C" stroke-width="2.6" marker-end="url(#sovdown)"/>
<rect x="60" y="724.17" width="1000" height="327.6" fill="#FFFFFF" stroke="#1F6B5C" stroke-width="2.14" rx="8.57"/>
<circle cx="102.86" cy="767.03" r="28.57" fill="#1F6B5C"/>
<text x="102.86" y="775.6" font-size="22.86" fill="white" font-weight="600" text-anchor="middle">30</text>
<text x="148.57" y="762.74" font-size="25.71" fill="#1A1A1A" font-weight="600">Sovereign meaning-making</text>
<text x="148.57" y="788.46" font-size="15.71" fill="#888888" font-style="italic">post-recognition</text>
<line x1="81.43" y1="812.74" x2="1038.57" y2="812.74" stroke="#7FB8AC" stroke-width="0.71"/>
<text x="81.43" y="841.31" font-size="17.14" fill="#1A1A1A">Productized interpretive frameworks proliferate, but the subject SELECTS deliberately. Agents serve</text>
<text x="81.43" y="864.29" font-size="17.14" fill="#1A1A1A">volition rather than substitute for it. Meaning remains suffered-for, not delivered.</text>
<text x="81.43" y="907.26" font-size="14.29" fill="#888888" font-weight="600" letter-spacing="0.71">CAPTURES (or rather: AUTHORS)</text>
<text x="81.43" y="928.69" font-size="15.71" fill="#1F6B5C" font-weight="500">Authorship of one's own interpretive frame</text>
<text x="81.43" y="963.09" font-size="14.29" fill="#888888" font-weight="600" letter-spacing="0.71">EXIT COST</text>
<text x="81.43" y="984.51" font-size="15.71" fill="#1A1A1A">Held only by ongoing conscious choice</text>
<text x="81.43" y="1016.06" font-size="14.29" fill="#888888" font-style="italic">Frankl 1946; Taylor 1989</text>
<line x1="560" y1="1065.77" x2="560" y2="1101.77" stroke="#1F6B5C" stroke-width="2.6" marker-end="url(#sovdown)"/>
<rect x="60" y="1113.77" width="1000" height="350.57" fill="#FFFFFF" stroke="#1F6B5C" stroke-width="2.14" rx="8.57"/>
<circle cx="102.86" cy="1156.63" r="28.57" fill="#1F6B5C"/>
<text x="102.86" y="1165.2" font-size="22.86" fill="white" font-weight="600" text-anchor="middle">31</text>
<text x="148.57" y="1152.34" font-size="25.71" fill="#1A1A1A" font-weight="600">Open meaning commons</text>
<text x="148.57" y="1178.06" font-size="15.71" fill="#888888" font-style="italic">systemic horizon</text>
<line x1="81.43" y1="1202.34" x2="1038.57" y2="1202.34" stroke="#7FB8AC" stroke-width="0.71"/>
<text x="81.43" y="1230.91" font-size="17.14" fill="#1A1A1A">Distributed sovereign agents + open infrastructure hold the field clear so that legibility remains</text>
<text x="81.43" y="1253.89" font-size="17.14" fill="#1A1A1A">achievable across generations. Plural meanings coexist without enclosure. DAX is the author's own worked</text>
<text x="81.43" y="1276.86" font-size="17.14" fill="#1A1A1A">example of such a constraint architecture — one instance, not the category.</text>
<text x="81.43" y="1319.83" font-size="14.29" fill="#888888" font-weight="600" letter-spacing="0.71">CAPTURES (or rather: AUTHORS)</text>
<text x="81.43" y="1341.26" font-size="15.71" fill="#1F6B5C" font-weight="500">Conditions for self-arrived meaning to remain possible</text>
<text x="81.43" y="1375.66" font-size="14.29" fill="#888888" font-weight="600" letter-spacing="0.71">EXIT COST</text>
<text x="81.43" y="1397.09" font-size="15.71" fill="#1A1A1A">Maintained by participation</text>
<text x="81.43" y="1428.63" font-size="14.29" fill="#888888" font-style="italic">Ostrom 1990; Illich 1973</text>
<text x="60" y="1522.34" font-size="17.5" fill="#555555" font-style="italic">Row 29 has no date because it is not an era. Its time column reads post-recognition (any phase), and its exit</text>
<text x="60" y="1546.34" font-size="17.5" fill="#555555" font-style="italic">cost reads n/a — recognition IS the exit. Nothing has to be built before the fork is available; something has</text>
<text x="60" y="1570.34" font-size="17.5" fill="#555555" font-style="italic">to be seen.</text>
<text x="60" y="1612.34" font-size="13.66" fill="#1A1A1A" font-weight="600">Severity and exit cost are the author’s own interpretive scale, not scholarship — no cited source ranks these phases.</text>
<text x="60" y="1630.38" font-size="13.66" fill="#555555">The citations support each card’s mechanism, not its position on this ramp.</text>
</svg>