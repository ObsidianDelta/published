<text x="736" y="608" font-size="14.5" fill="#555555" font-style="italic">Row 15 still captures a frame you live inside. From</text>
<text x="736" y="628" font-size="14.5" fill="#555555" font-style="italic">row 16 the target is the body that has to eat and</text>
<text x="736" y="648" font-size="14.5" fill="#555555" font-style="italic">the hours it must sell.</text>
<text x="44" y="1046" font-size="14.52" fill="#1A1A1A" font-weight="600">Severity and exit cost are the author’s own interpretive scale, not scholarship — no cited source ranks these phases.</text>
<text x="44" y="1065.16" font-size="14.52" fill="#555555">The citations support each card’s mechanism, not its position on this ramp.</text>
