<text x="987.2" y="1182" font-size="19.2" fill="#888888" text-anchor="end">sev 8/10</text>
<text x="44" y="1252.4" font-size="17.5" fill="#555555" font-style="italic">Consumer identity captures the self-concept at severity eight. Web 1.0 drops it to two for about a</text>
<text x="44" y="1276.4" font-size="17.5" fill="#555555" font-style="italic">decade. Platform consolidation puts it back to eight at a higher level of abstraction. The reprieve was</text>
<text x="44" y="1300.4" font-size="17.5" fill="#555555" font-style="italic">real, and it was brief.</text>
<text x="44" y="1342.4" font-size="12.79" fill="#1A1A1A" font-weight="600">Severity and exit cost are the author’s own interpretive scale, not scholarship — no cited source ranks these phases.</text>
<text x="44" y="1359.28" font-size="12.79" fill="#555555">The citations support each card’s mechanism, not its position on this ramp.</text>
