  },en:{

  var LANG="fr";
  try{ var sl=localStorage.getItem("deuxcoeurs_lang"); if(sl==="en"||sl==="fr") LANG=sl; }catch(e){}

  // --- audio ---
  var AC=null;
  function ctx(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
  function note(freq,t0,dur,peak){
    var ac=ctx(); if(!ac) return;
    var m=ac.createGain(); m.gain.setValueAtTime(0.0001,t0);
    m.gain.exponentialRampToValueAtTime(peak||0.3,t0+0.012); m.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    var lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600; m.connect(lp); lp.connect(ac.destination);
    var parts=[[1,1],[2,.32],[3,.14],[4,.06]];
    for(var i=0;i<parts.length;i++){ var o=ac.createOscillator(),g=ac.createGain();
      o.type="sine"; o.frequency.value=freq*parts[i][0]; o.detune.value=(i?6:0); g.gain.value=parts[i][1];
      o.connect(g); g.connect(m); o.start(t0); o.stop(t0+dur+0.1); }
  }
  function playSeq(notes,gap,dur){ var ac=ctx(); if(!ac) return; if(ac.state==="suspended") ac.resume();
    var t=ac.currentTime+0.04; notes.forEach(function(n,i){ note(FREQ[n],t,(i===notes.length-1)?3.0:(dur||2.4),0.3); t+=(gap||0.5); }); }
  function playChord(notes,dur){ var ac=ctx(); if(!ac) return; if(ac.state==="suspended") ac.resume();
    var t=ac.currentTime+0.04; notes.forEach(function(n){ note(FREQ[n],t,dur||3.4,0.17); }); unlock(); }

  // --- progressive unlock (engage -> the culture card appears) ---
  var unlocked=false;
  function unlock(){ if(unlocked) return; unlocked=true;
    var c=document.getElementById("cultcard"); c.hidden=false;
    requestAnimationFrame(function(){ c.classList.remove("locked"); });
  }

  // --- state ---
  var song=[], assoc=[], culture={where:"",what:""}, lastSound=null;
  function save(){ try{ localStorage.setItem("deuxcoeurs_state",JSON.stringify({song:song,assoc:assoc,culture:culture})); }catch(e){} }
  function load(){ try{ var s=JSON.parse(localStorage.getItem("deuxcoeurs_state")); if(s){ if(Array.isArray(s.song))song=s.song.filter(function(k){return BY[k];}).slice(0,24);
    if(Array.isArray(s.assoc))assoc=s.assoc.slice(0,30); if(s.culture)culture=s.culture; } }catch(e){} }

  // --- builders (language-aware) ---
  function buildStudioPad(){ var pad=document.getElementById("pad"); pad.innerHTML="";
    WORDS.forEach(function(x){ var b=document.createElement("button"); b.className="key"; b.setAttribute("data-add",x.k);
      b.innerHTML='<span class="emo">'+x.e+'</span>'+x[LANG]+'<span class="sol">'+SOLF[x.n]+'</span>';
      b.addEventListener("click",function(){ if(song.length<24){ song.push(x.k); renderSong(); } playSeq([x.n],0.5,2.2); unlock(); });
      pad.appendChild(b); }); }
  function renderSong(){ save(); var strip=document.getElementById("strip");
    if(!song.length){ strip.innerHTML='<span class="empty">'+T[LANG].stripEmpty+'</span>'; return; }
    strip.innerHTML=""; song.forEach(function(k,idx){ var x=BY[k]; var c=document.createElement("button"); c.className="chip"; c.type="button";
      c.innerHTML=x.e+' '+x[LANG]+' <span class="x">×</span>'; c.addEventListener("click",function(){ song.splice(idx,1); renderSong(); }); strip.appendChild(c); }); }
  function buildPiano(){ var el=document.getElementById("piano"); el.innerHTML=""; var EMOK={D:"❤️",G:"💛"};
    PIANO.forEach(function(nn){ var b=document.createElement("button"); b.className="pk"+(EMOK[nn]?" heart":"");
      b.innerHTML=(EMOK[nn]||"🎵")+'<small>'+SOLF[nn]+'</small>';
      b.addEventListener("click",function(){ playSeq([nn],0.5,2.6); setSel((EMOK[nn]?EMOK[nn]+" ":"")+T[LANG].noteWord+SOLF[nn]); unlock(); }); el.appendChild(b); }); }
  function buildChords(){ var el=document.getElementById("chords"); el.innerHTML="";
    CHORDS.forEach(function(c){ var b=document.createElement("button"); b.className="chord"; b.textContent="🎹 "+c[LANG];
      b.addEventListener("click",function(){ playChord(c.notes,3.4); setSel(T[LANG].chordWord+c[LANG]); }); el.appendChild(b); }); }
  function setSel(s){ lastSound=s; document.getElementById("labsel").textContent=s; }
  function renderAssoc(){ save(); var ul=document.getElementById("assoclist"); ul.innerHTML="";
    assoc.forEach(function(a,idx){ var li=document.createElement("li"); var span=document.createElement("span"); span.textContent=a.sound+" → ";
      var st=document.createElement("strong"); st.textContent=a.word; span.appendChild(st); li.appendChild(span);
      var x=document.createElement("button"); x.type="button"; x.setAttribute("aria-label","x"); x.textContent="×";
      x.addEventListener("click",function(){ assoc.splice(idx,1); renderAssoc(); }); li.appendChild(x); ul.appendChild(li); }); }
  function renderStory(){ var ol=document.getElementById("story"); ol.innerHTML="";
    STORY[LANG].forEach(function(line,i){ var li=document.createElement("li"); var n=document.createElement("span"); n.className="n"; n.textContent=(i+1);
      var t=document.createElement("span"); t.textContent=line; li.appendChild(n); li.appendChild(t); ol.appendChild(li); }); }
  function renderCultEcho(){ var e=document.getElementById("cultEcho");
    if(culture.where||culture.what){ e.textContent=T[LANG].cultEcho+[culture.where,culture.what].filter(Boolean).join(" · "); e.style.display=""; } else { e.style.display="none"; } }

  // --- i18n apply ---
  function applyLang(){
    document.documentElement.lang=LANG;
    document.querySelectorAll("[data-i18n]").forEach(function(el){ var k=el.getAttribute("data-i18n"); if(T[LANG][k]!=null) el.textContent=T[LANG][k]; });

    document.getElementById("noteSol").textContent=(LANG==="fr"?"SOL":"G");

    document.getElementById("cultWhere").placeholder=T[LANG].cultWherePH;
    document.getElementById("cultWhat").placeholder=T[LANG].cultWhatPH;

    buildStudioPad(); renderSong(); buildPiano(); buildChords(); renderAssoc(); renderStory(); renderCultEcho();
  }
  document.getElementById("langtoggle").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return;
    LANG=b.getAttribute("data-lang"); try{ localStorage.setItem("deuxcoeurs_lang",LANG); }catch(e2){} applyLang(); });

  // --- fixed handlers ---
  var gap=0.6;

  document.getElementById("relove").addEventListener("click",function(){ playSeq(["D","G","D","G"],0.42,1.6); unlock(); });

  document.getElementById("clear").addEventListener("click",function(){ song=[]; renderSong(); });
  document.getElementById("surprise").addEventListener("click",function(){ var n=4+Math.floor(Math.random()*4); song=[];
    for(var i=0;i<n;i++){ song.push(WORDS[Math.floor(Math.random()*WORDS.length)].k); } renderSong(); unlock(); playSeq(song.map(function(k){return BY[k].n;}),gap,gap<0.5?1.6:2.4); });
  function copyText(text,btn,okLabel){ var old=btn.textContent; function ok(){ btn.textContent=okLabel; setTimeout(function(){btn.textContent=old;},1600); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok).catch(ok); } else { ok(); } }
  document.getElementById("copysong").addEventListener("click",function(){ if(!song.length){ var t=this,o=t.textContent; t.textContent=T[LANG].needSong; setTimeout(function(){t.textContent=o;},1800); return; }
    copyText(T[LANG].songCopyPrefix+song.map(function(k){return BY[k].e+" "+BY[k][LANG];}).join(" · "),this,T[LANG].copied); });
  var assocWord=document.getElementById("assocword");
  document.getElementById("assocadd").addEventListener("click",function(){ var w=(assocWord.value||"").trim(); if(!lastSound||!w){ var t=this,o=t.textContent; t.textContent=T[LANG].needBoth; setTimeout(function(){t.textContent=o;},1600); return; }
    if(assoc.length<30) assoc.push({sound:lastSound,word:w}); assocWord.value=""; renderAssoc(); unlock(); });

    copyText(T[LANG].mapCopyPrefix+assoc.map(function(a){return a.sound+" → "+a.word;}).join(" · "),this,T[LANG].copied); });

    culture.what=(document.getElementById("cultWhat").value||"").trim(); save(); renderCultEcho(); var t=this,o=t.textContent; t.textContent=T[LANG].cultSaved; setTimeout(function(){t.textContent=o;},1600); });
  document.getElementById("copylink").addEventListener("click",function(){ copyText(document.getElementById("shareurl").textContent.trim(),this,T[LANG].copied); });

  // --- boot ---
  load();
  if(culture.where){ document.getElementById("cultWhere").value=culture.where; }
  if(culture.what){ document.getElementById("cultWhat").value=culture.what; }
  if(song.length||assoc.length||culture.where||culture.what){ unlocked=true; var c=document.getElementById("cultcard"); c.hidden=false; c.classList.remove("locked"); }

  (function(){ try{ var url=document.getElementById("shareurl").textContent.trim(); var qr=qrcode(0,"M"); qr.addData(url); qr.make();
