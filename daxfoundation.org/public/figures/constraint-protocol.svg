<text x="302" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#e8e8e8" font-weight="600">ACT</text>
<text x="302" y="136" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">Work goes ahead;</text>
<text x="302" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">a constraint can</text>
<text x="302" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">hold it up.</text>
