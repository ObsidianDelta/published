<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
<title id="t">The Constraint Protocol, in one picture</title>
<desc id="d">Four stages left to right: declare, act, witness, judge. A party declares in advance what it will not do; work goes ahead, and a declared constraint can hold up named work; every event is signed onto a record nobody can quietly edit; judging is kept separate from witnessing. Beneath them runs the record, a chain of linked entries. An attempt to get round a constraint branches off the act stage and is refused and recorded for good. A loop from the record back to judging reads: anyone can dispute any record.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c8c8c"/></marker></defs>
<rect width="1000" height="640" fill="#0a0a0a"/>
<rect x="50" y="50" width="205" height="190" rx="12" fill="none" stroke="#e8e8e8" stroke-width="2"/>
<text x="70" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#e8e8e8" font-weight="600">DECLARE</text>
<text x="70" y="136" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">States, in advance,</text>
<text x="70" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">what it will</text>
<text x="70" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">not do.</text>
