<text x="765" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#e8e8e8" font-weight="600">JUDGE</text>
<text x="765" y="136" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">Kept separate</text>
<text x="765" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">from witnessing.</text>
