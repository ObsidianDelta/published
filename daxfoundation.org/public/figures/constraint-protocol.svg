<text x="533" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#e8e8e8" font-weight="600">WITNESS</text>
<text x="533" y="136" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">Every event signed</text>
<text x="533" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">onto a record</text>
<text x="533" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#cfcfcf">nobody can edit.</text>
