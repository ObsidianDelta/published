<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Un parcours en français pour comprendre les fractions avec le football et la course, à faire avec un parent. Exemple MetaDAX.">
<title>Le Stade des Fractions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>/* Layout: stadium broadcast — live 3D stadium on the left (top on phones), the match sheet on the right, scoreboard bar on top. */
:root {
  --bg: #eaf1e6;
  --surface: #ffffff;
  --surface-2: #f4f8f1;
  --ink: #12211a;
  --muted: #4b5f55;
  --line: #d0dacb;
  --pitch: #1f6e39;
  --pitch-ink: #ffffff;
  --track: #b44a26;
  --gold: #f2b705;
  --gold-ink: #1c1500;
  --red: #c32d27;
  --blue: #2659c0;
  --good: #187d43;
  --violet: #6f45d0;
  --stage-bg: #a8d8f2;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.3rem;
  --step-4: 3.3rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09120e; --surface: #101c16; --surface-2: #15241c; --ink: #ecf3ed; --muted: #a2b5a9; --line: #253629;
    --pitch: #2b8a48; --pitch-ink: #ffffff; --track: #d36a42; --gold: #f5c02a; --gold-ink: #1c1500;
    --red: #f0625a; --blue: #6c9cf3; --good: #45c27a; --violet: #a989f4; --stage-bg: #081324;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09120e; --surface: #101c16; --surface-2: #15241c; --ink: #ecf3ed; --muted: #a2b5a9; --line: #253629;
  --pitch: #2b8a48; --pitch-ink: #ffffff; --track: #d36a42; --gold: #f5c02a; --gold-ink: #1c1500;
  --red: #f0625a; --blue: #6c9cf3; --good: #45c27a; --violet: #a989f4; --stage-bg: #081324;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; margin: 0; line-height: 1.05; }

/* ── barre du haut ── */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--pitch); color: var(--pitch-ink); border-bottom: 4px solid var(--gold); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: inherit; text-align: left; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; letter-spacing: 0.03em; text-transform: uppercase; line-height: 1; }
.top-nav { display: flex; gap: 6px; margin-left: auto; }
.top-nav button { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); color: inherit; border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: 0.95rem; }
.top-nav button[aria-current="page"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.score { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: 0.04em; text-transform: uppercase; background: #0b1410; color: #f2b705; padding: 4px 12px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── programme ── */
.program-wrap { overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--line); }
.program { display: flex; gap: 6px; padding: 10px 16px; margin: 0; list-style: none; min-width: max-content; }
.program li { list-style: none; }
.program button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 14px 6px 6px; font-weight: 700; font-size: 0.95rem; }
.program .num { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--line); color: var(--ink); font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; }
.program button[aria-current="step"] { border-color: var(--pitch); background: var(--pitch); color: var(--pitch-ink); }
.program button[aria-current="step"] .num { background: var(--gold); color: var(--gold-ink); }
.program .done .num { background: var(--good); color: #fff; }
.program .tick { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.program button[aria-current="step"] .tick { color: inherit; opacity: 0.85; }

/* ── mise en page ── */
.layout { display: grid; grid-template-columns: 1fr; gap: 0; }
.stage-wrap { position: relative; background: var(--stage-bg); }
.stage { height: 44vh; min-height: 260px; max-height: 520px; width: 100%; position: relative; }
.stage .nogl { position: absolute; inset: 16px; display: grid; place-items: center; text-align: center; background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 16px; }
.caption { position: absolute; left: 12px; bottom: 12px; right: 12px; margin: 0; pointer-events: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
.caption span { background: rgba(9,18,14,0.82); color: #f4f7f2; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; max-width: 100%; }
.hint-3d { position: absolute; top: 10px; right: 12px; margin: 0; background: rgba(9,18,14,0.7); color: #f4f7f2; font-size: 0.78rem; padding: 3px 8px; border-radius: 6px; pointer-events: none; }
.panel { padding: 20px 16px 48px; min-width: 0; }
.panel-inner { max-width: 680px; margin: 0 auto; display: grid; gap: 18px; }
@media (min-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1.25fr) minmax(380px, 1fr); align-items: start; }
  .stage-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); height: calc(100vh - 58px - 56px); }
  .stage { height: 100%; max-height: none; }
  .panel { padding: 24px 28px 64px; }
}

/* ── panneau ── */
.eyebrow { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--track); font-size: 1rem; margin: 0; }
.title { font-size: var(--step-3); }
.lede { color: var(--muted); margin: 0; font-size: var(--step-0); max-width: 62ch; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 10px 14px 8px; font-weight: 700; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; font-size: 1.02rem; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.say { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--gold); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; }
.say .count { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-size: 0.95rem; }
.say p { margin: 0; font-size: var(--step-1); line-height: 1.45; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 2px solid var(--ink); background: var(--surface); color: var(--ink); padding: 9px 16px; border-radius: 8px; font-weight: 700; }
.btn.primary { background: var(--pitch); border-color: var(--pitch); color: var(--pitch-ink); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.free { background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.free p { margin: 0; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); font-size: 1.3rem; font-weight: 700; line-height: 1; }
.stepper output { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.bigfrac { font-size: 2.2rem; }
.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.why li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; font-size: var(--step-0); }

/* fractions empilées */
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; font-family: var(--font-display); font-weight: 800; font-size: 1.12em; margin: 0 0.12em; font-variant-numeric: tabular-nums; }
.fr .n { padding: 0 0.15em 0.08em; border-bottom: 0.09em solid currentColor; }
.fr .d { padding: 0.08em 0.15em 0; }

/* ── questions ── */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.dot.now { border-color: var(--ink); }
.dot.first { background: var(--good); border-color: var(--good); }
.dot.second { background: var(--gold); border-color: var(--gold); }
.dot.shown { background: var(--red); border-color: var(--red); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 16px; }
.qtext { font-size: var(--step-1); margin: 0; line-height: 1.45; }
.answer { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.frac-in { display: inline-grid; grid-template-rows: auto 6px auto; justify-items: center; gap: 4px; }
.frac-in input { width: 4.6ch; text-align: center; font-family: var(--font-display); font-size: 2rem; font-weight: 800; padding: 2px 4px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.frac-in .bar { width: 100%; height: 5px; background: var(--ink); border-radius: 3px; }
.num-in { display: inline-flex; align-items: center; gap: 8px; }
.num-in input { width: 7ch; font-family: var(--font-display); font-size: 2rem; font-weight: 800; padding: 2px 8px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface-2); text-align: center; }
.num-in .unit { font-weight: 700; color: var(--muted); }
.cmp { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 1.6rem; }
.cmp .slot { width: 56px; height: 56px; border: 3px dashed var(--line); border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 2rem; }
.opts { display: flex; gap: 10px; flex-wrap: wrap; }
.opts .btn { min-width: 64px; font-size: 1.2rem; }
.feedback { border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; }
.feedback p { margin: 0; }
.feedback.ok { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border: 2px solid var(--good); }
.feedback.no { background: color-mix(in srgb, var(--gold) 16%, var(--surface)); border: 2px solid var(--gold); }
.feedback.show { background: color-mix(in srgb, var(--red) 10%, var(--surface)); border: 2px solid var(--red); }
.feedback strong { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.02em; }
.done-card { background: var(--pitch); color: var(--pitch-ink); border-radius: var(--radius); padding: 20px; display: grid; gap: 10px; }
.done-card h3 { font-size: var(--step-2); }

/* ── guide et bilan ── */
.doc { display: grid; gap: 14px; }
.doc h2 { font-size: var(--step-2); }
.doc h3 { font-size: var(--step-1); }
.doc p, .doc li { max-width: 66ch; }
.doc > p, .gblock > p { margin: 0; }
.doc ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.gblock { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; }
.gblock .meta { color: var(--muted); font-size: 0.95rem; }
.label { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.95rem; color: var(--track); margin: 4px 0 0; }
.key { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
table.res { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table.res th, table.res td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.res th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.95rem; color: var(--muted); }
.note { width: 100%; min-height: 260px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.9rem; line-height: 1.5; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); resize: vertical; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; }
.field input { padding: 9px 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 320px; }
.hero { display: grid; gap: 12px; }
.hero h1 { font-size: var(--step-4); text-transform: uppercase; letter-spacing: 0.02em; }
.hero .stripe { height: 8px; width: 140px; background: linear-gradient(90deg, var(--pitch) 0 33%, var(--gold) 33% 66%, var(--track) 66%); border-radius: 4px; }
.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plan li { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; }
.plan .num { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); font-family: var(--font-display); font-weight: 800; }
.muted { color: var(--muted); }
.confirm { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.print-only { display: none; }
.mobile-only { display: none; }
@media (max-width: 959px) {
  .stage-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 56px)); z-index: 10; box-shadow: 0 6px 14px rgba(0,0,0,0.18); }
  .stage { height: 38vh; min-height: 220px; max-height: 420px; }
  .program-wrap { position: relative; }
}
@media (max-width: 640px) {
  .top-nav { display: none; }
  .mobile-only { display: list-item; }
  .score { margin-left: auto; }
}

@media (max-width: 520px) {
  .brand-name { font-size: 1.05rem; white-space: nowrap; }
  .brand-mark { width: 26px; height: 26px; }
  .top-nav button { padding: 4px 10px; font-size: 0.88rem; }
  .score { font-size: 1.05rem; padding: 3px 8px; }
  .title { font-size: 2rem; }
  .hero h1 { font-size: 2.5rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

@media print {
  .bar, .program-wrap, .stage-wrap, .tabs, .btn, .no-print { display: none !important; }
  .layout { display: block; }
  .panel { padding: 0; }
  body { background: #fff; color: #000; font-size: 12pt; }
  .gblock, .qcard { break-inside: avoid; border-color: #999; }
  .print-only { display: block; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="brand" data-go="accueil" aria-label="Accueil — Le Stade des Fractions">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#ffffff"/><path d="M16 2a14 14 0 0 1 0 28" fill="#f2b705"/><line x1="16" y1="2" x2="16" y2="30" stroke="#12211a" stroke-width="2"/><circle cx="16" cy="16" r="14" fill="none" stroke="#12211a" stroke-width="2"/></svg>
    <span class="brand-name">Le Stade des Fractions</span>
  </button>
  <nav class="top-nav" aria-label="Pages">
    <button data-go="guide">Guide</button>
    <button data-go="bilan">Bilan</button>
  </nav>
  <div class="score" aria-live="polite"><span id="who">Toi</span> · <span id="goals">0 but</span></div>
</header>
<div class="program-wrap"><ol class="program" id="program" aria-label="Le programme du match"></ol></div>
<main class="layout">
  <section class="stage-wrap" id="stage-wrap" aria-label="Le stade en 3D">
    <div class="stage" id="stage"></div>
    <p class="hint-3d" id="hint3d" hidden>Glisse pour tourner · pince pour zoomer</p>
    <p class="caption" id="caption"></p>
  </section>
  <section class="panel" id="panel" aria-live="off"></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/* Le Stade des Fractions — contenu (français).
   Rôles : « le guide » (le parent qui accompagne, vouvoyé) et « l'apprenant » (tutoyé).
   Toute fraction écrite a/b dans un texte est affichée empilée à l'écran. */

const COURSE = {
  title: "Le Stade des Fractions",
  learner: "Pour un apprenant de 11 ans qui aime le football et la course, accompagné par un parent.",
  stations: [
  /* ───────────────────────── 0 ───────────────────────── */
  {
    id: 0, short: "Échauffement", title: "Une fraction, c'est quoi ?", scene: "pitch",
    intro: "Avant de jouer avec les fractions, il faut savoir ce qu'elles veulent dire. Le terrain de foot va nous servir de « tout ».",
    presets: [
      { label: "La moitié du terrain", steps: [
        { say: "Voici le terrain entier. C'est notre « tout ».", s: { d: 1, n: 0 } },
        { say: "On le coupe en 2 parts égales, par la ligne du milieu.", s: { d: 2, n: 0 } },
        { say: "On prend 1 part sur 2. C'est 1/2 du terrain : la moitié. Le bas (2) dit en combien de parts égales on coupe. Le haut (1) dit combien de parts on prend.", s: { d: 2, n: 1 } }
      ]},
      { label: "Trois quarts", steps: [
        { say: "On coupe le terrain en 4 parts égales. Chaque part est un quart.", s: { d: 4, n: 0 } },
        { say: "On prend 1 part : 1/4.", s: { d: 4, n: 1 } },
        { say: "On en prend 3 : c'est 3/4 du terrain. Il reste 1/4 sans couleur.", s: { d: 4, n: 3 } }
      ]},
      { label: "Deux cinquièmes", steps: [
        { say: "5 parts égales : chaque part est un cinquième.", s: { d: 5, n: 0 } },
        { say: "On en prend 2 : 2/5. Attention, on ne compare pas 2 avec 3 (les parts restantes). On compare 2 avec 5 (toutes les parts).", s: { d: 5, n: 2 } }
      ]},
      { label: "Le terrain entier", steps: [
        { say: "8 parts égales : des huitièmes. Elles sont plus petites que des quarts, parce qu'on a coupé plus de fois.", s: { d: 8, n: 0 } },
        { say: "On prend les 8 parts : 8/8. C'est le terrain entier, donc 8/8 = 1.", s: { d: 8, n: 8 } }
      ]},
      { label: "Piège : des parts pas égales", steps: [
        { say: "Ici aussi le terrain est coupé en 3 parts…", s: { unequal: true, n: 0 } },
        { say: "…mais les parts n'ont pas la même taille. Ce ne sont donc PAS des tiers. Une fraction, c'est toujours des parts égales.", s: { unequal: true, n: 1 } }
      ]}
    ],
    play: "Joue toi-même : choisis le nombre de parts avec − et +, puis touche les parts du terrain pour les colorier.",
    why: [
      "Une fraction décrit une partie d'un tout. Le tout est coupé en parts ÉGALES.",
      "Le nombre du bas s'appelle le dénominateur. Il dit en combien de parts égales on a coupé le tout.",
      "Le nombre du haut s'appelle le numérateur. Il dit combien de ces parts on prend.",
      "Plus on coupe, plus les parts sont petites : un huitième de terrain est plus petit qu'un quart de terrain.",
      "Quand on prend toutes les parts, on a le tout : 4/4 = 8/8 = 1.",
      "Dans un match de 90 minutes, la mi-temps arrive après 45 minutes : c'est 1/2 du match, parce que le match est coupé en 2 périodes égales."
    ],
    questions: [
      { t: "frac", q: "Le terrain est coupé en 5 parts égales. 2 parts sont coloriées. Quelle fraction du terrain est coloriée ?", a: [2,5], scene: { d: 5, n: 2 },
        hint: "Compte toutes les parts (en bas), puis les parts coloriées (en haut).",
        why: "5 parts égales en tout, 2 coloriées : 2/5.",
        traps: [ { a: [2,3], note: "a comparé les parts coloriées aux parts NON coloriées (2 et 3) au lieu de toutes les parts (5)." } ] },
      { t: "num", q: "En combien de parts égales faut-il couper le terrain pour avoir des quarts ?", a: 4, unit: "parts", scene: { d: 4, n: 0 },
        hint: "Un quart, c'est une part quand le tout est coupé en… ?",
        why: "Des quarts : le tout est coupé en 4 parts égales." },
      { t: "frac", q: "Un match dure 90 minutes. À la mi-temps, quelle fraction du match a été jouée ?", a: [1,2], scene: { d: 2, n: 1 },

  function mat(c, o) { return new T.MeshLambertMaterial(Object.assign({ color: c }, o || {})); }

  function disposeTree(o) {

  function lanePos(t, r) {

  function pitchTexture() {
    const s = 20, cv = document.createElement("canvas");
    cv.width = PL * s; cv.height = PW * s;
    const c = cv.getContext("2d");
    const bands = 14;
    for (let i = 0; i < bands; i++) {
      c.fillStyle = i % 2 ? "#2b7f41" : "#318d49";
      c.fillRect((i * cv.width) / bands, 0, cv.width / bands + 1, cv.height);
    }
    c.strokeStyle = "#f4f7f1"; c.lineWidth = 0.14 * s * 1.6;
    const m = (x) => x * s, X = (x) => m(x + PL / 2), Y = (y) => m(y + PW / 2);
    c.strokeRect(m(0.2), m(0.2), cv.width - m(0.4), cv.height - m(0.4));
    c.beginPath(); c.moveTo(X(0), Y(-PW / 2)); c.lineTo(X(0), Y(PW / 2)); c.stroke();
    c.beginPath(); c.arc(X(0), Y(0), m(9.15), 0, Math.PI * 2); c.stroke();
    c.fillStyle = "#f4f7f1";
    [[0, 0], [-PL / 2 + 11, 0], [PL / 2 - 11, 0]].forEach(([x, y]) => { c.beginPath(); c.arc(X(x), Y(y), m(0.25), 0, Math.PI * 2); c.fill(); });
    [-1, 1].forEach((sd) => {
      const gx = sd * PL / 2;
      c.strokeRect(Math.min(X(gx), X(gx - sd * 16.5)), Y(-20.16), m(16.5), m(40.32));
      c.strokeRect(Math.min(X(gx), X(gx - sd * 5.5)), Y(-9.16), m(5.5), m(18.32));
      c.beginPath();
      const a0 = sd > 0 ? Math.PI - 0.93 : -0.93, a1 = sd > 0 ? Math.PI + 0.93 : 0.93;
      c.arc(X(gx - sd * 11), Y(0), m(9.15), a0, a1); c.stroke();
    });
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([a, b]) => { c.beginPath(); c.arc(X(a * PL / 2), Y(b * PW / 2), m(1), 0, Math.PI * 2); c.stroke(); });
    const t = new T.CanvasTexture(cv);
    t.encoding = T.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function ballTexture() {
    const cv = document.createElement("canvas"); cv.width = 512; cv.height = 256;
    const c = cv.getContext("2d");
    c.fillStyle = "#f8f8f4"; c.fillRect(0, 0, 512, 256);
    c.fillStyle = "#161616";
    const spots = [[64, 128], [192, 128], [320, 128], [448, 128], [0, 40], [128, 40], [256, 40], [384, 40], [512, 40], [0, 216], [128, 216], [256, 216], [384, 216], [512, 216]];

  /* ───────── caméra ───────── */
  const VIEWS = {
    home:  { target: [0, 0, 0], r: 185, theta: 0.85, phi: 0.98, auto: true, fit: 260 },
    pitch: { target: [0, 0, 6], r: 112, theta: 0, phi: 0.6, fit: 118 },
    track: { target: [0, 0, 4], r: 150, theta: 0, phi: 0.7, fit: 186 },
    balls: { target: [0, 0, 0], r: 34, theta: 0, phi: 0.82, fit: 34 },

  };
  let viewName = "home";
  function fitRadius(v) {
    if (!v.fit) return v.r;
    const asp = camera.aspect, vf = (camera.fov * Math.PI) / 180;
    const hf = 2 * Math.atan(Math.tan(vf / 2) * asp);
    const need = v.fit / 2 / Math.tan(hf / 2);
    return Math.max(v.r, need * 1.02);
  }
  function applyOrbit() {
    const o = orbit;
    const sp = Math.sin(o.phi);
    camera.position.set(o.target.x + o.r * sp * Math.sin(o.theta), o.target.y + o.r * Math.cos(o.phi), o.target.z + o.r * sp * Math.cos(o.theta));
    camera.lookAt(o.target);
  }
  function view(name, instant) {
    const v = VIEWS[name] || VIEWS.home;
    viewName = name;
    const from = { x: orbit.target.x, y: orbit.target.y, z: orbit.target.z, r: orbit.r, theta: orbit.theta, phi: orbit.phi };
    let tTheta = v.theta;
    while (tTheta - from.theta > Math.PI) tTheta -= Math.PI * 2;
    while (tTheta - from.theta < -Math.PI) tTheta += Math.PI * 2;
    const to = { x: v.target[0], y: v.target[1], z: v.target[2], r: fitRadius(v), theta: tTheta, phi: v.phi };
    orbit.auto = !!v.auto; orbit.user = false;
    if (instant || reduce) { Object.assign(orbit, { r: to.r, theta: to.theta, phi: to.phi }); orbit.target.set(to.x, to.y, to.z); applyOrbit(); return; }
    tween(1.6, (k) => {
      const e = ease(k);
      orbit.target.set(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e, from.z + (to.z - from.z) * e);
      orbit.r = from.r + (to.r - from.r) * e;
      orbit.theta = from.theta + (to.theta - from.theta) * e;
      orbit.phi = from.phi + (to.phi - from.phi) * e;
      applyOrbit();
    });
  }

  /* ───────── contrôles (glisser, pincer, molette, toucher) ───────── */
  function bindControls(cv) {
    const pts = new Map(); let downAt = null, moved = 0, pinch0 = 0, r0 = 0;
    cv.addEventListener("pointerdown", (e) => {
      cv.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      downAt = { x: e.clientX, y: e.clientY }; moved = 0;
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); r0 = orbit.r; }
    });
    cv.addEventListener("pointermove", (e) => {
      if (!pts.has(e.pointerId)) return;
      const p = pts.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved += Math.abs(dx) + Math.abs(dy);
      if (pts.size === 2) {
        const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinch0 > 0) orbit.r = clampR(r0 * (pinch0 / d));
      } else if (moved > 6) {
        orbit.theta -= dx * 0.006; orbit.phi = Math.min(1.45, Math.max(0.12, orbit.phi - dy * 0.005));
        orbit.auto = false; orbit.user = true;
      }
      applyOrbit();
    });
    const up = (e) => {
      if (pts.size === 1 && moved < 7 && downAt) pick(e);
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch0 = 0;
    };
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", (e) => pts.delete(e.pointerId));
    cv.addEventListener("wheel", (e) => { e.preventDefault(); orbit.r = clampR(orbit.r * (1 + Math.sign(e.deltaY) * 0.08)); orbit.auto = false; applyOrbit(); }, { passive: false });
  }
  function clampR(r) { return Math.min(420, Math.max(6, r)); }
  const ray = new T.Raycaster(), ndc = new T.Vector2();
  function pick(e) {
    if (!clickables.length || !onPick) return;
    const rect = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(clickables, false)[0];
    if (hit) onPick(hit.object.userData);
  }

  /* — Terrain coupé en parts — */
  function pitchCtrl() {
    const c = { key: "pitch", strips: [], group: new T.Group(), label: null, state: {} };
    overlay.add(c.group);

  /* — Piste : comparer, additionner, soustraire, unités — */
  function ticksGroup(d, opts) {
    opts = opts || {};
    const g = new T.Group();
    if (!d) return g;
    for (let k = 0; k <= d; k++) {
      const t = k / d;
      const p = lanePos(t, R0 + (LW * NL) / 2), tg = laneTan(t, R0 + (LW * NL) / 2);
      const bar = new T.Mesh(new T.BoxGeometry(0.55, 0.06, LW * NL + 0.6), basic(0xffffff));
      bar.position.set(p.x, 0.09, p.z); bar.rotation.y = Math.atan2(tg.x, tg.z) + Math.PI / 2; bar.renderOrder = 4;
      g.add(bar);
      if (k > 0 && k < d && d <= 12 && !opts.noLabels) {
        const lp = lanePos(t, ROUT + 9);
        const lb = label(opts.fmt ? opts.fmt(k) : `${k}/${d}`, { size: 52, scale: d > 8 ? 6.5 : 8, bg: "rgba(255,255,255,0.92)", fg: "#13221a" });
        lb.position.set(lp.x, 5, lp.z); g.add(lb);
      }
    }
    return g;
  }

  /* — Ballons en groupes — */
  function ballsCtrl() {
    const c = { key: "balls", group: new T.Group(), state: {}, balls: [], hoops: [], lbls: [] };
    overlay.add(c.group);
    const geo = SHARED.ballGeo || (SHARED.ballGeo = new T.SphereGeometry(0.55, 22, 16));
    geo.userData.shared = true;
    const ballMat = SHARED.ballMat || (SHARED.ballMat = new T.MeshLambertMaterial({ map: SHARED.ballTex }));
    ballMat.userData.shared = true;
    const ghostMat = SHARED.ghostMat || (SHARED.ghostMat = new T.MeshBasicMaterial({ color: COL.violet, wireframe: true, transparent: true, opacity: 0.55 }));
    ghostMat.userData.shared = true;
    const layout = (d, k) => {
      const Rh = 1.1 + Math.sqrt(k) * 0.72, gap = 1.3;
      const perRow = d <= 4 ? d : Math.ceil(d / 2);
      const rowsN = Math.ceil(d / perRow);
      const cells = [];
      for (let i = 0; i < d; i++) {
        const row = Math.floor(i / perRow), col = i % perRow;
        const inRow = row === rowsN - 1 ? d - row * perRow : perRow;
        const x = (col - (inRow - 1) / 2) * (2 * Rh + gap);
        const z = (row - (rowsN - 1) / 2) * (2 * Rh + gap) + 1.2;
        cells.push({ x, z, R: Rh });
      }

    };
    const slot = (cell, j, k) => {

      const inner = k > 7 ? Math.min(3, Math.floor(k / 3)) : 0;

      const m = k - inner, jj = j - inner, a = (jj / m) * Math.PI * 2 + 0.3;

    const clear = () => { c.group.children.slice().forEach((ch) => { c.group.remove(ch); disposeTree(ch); }); c.balls = []; c.hoops = []; c.lbls = []; };
    const clearLbls = () => { c.lbls.forEach((l) => { c.group.remove(l); disposeTree(l); }); c.lbls = []; };

    const hoopColors = [0x2f6fd8, 0xd2372c, 0x23a55a, 0xe86a1c, 0x8b5cf6, 0x0e9aa7];

      const cells = layout(s.d, k);

        clear();
        cells.forEach((cell, i) => {
          const ghost = whole && i >= s.n;
          const h = new T.Mesh(new T.TorusGeometry(cell.R, 0.11, 8, 48), basic(ghost ? COL.violet : hoopColors[i % hoopColors.length], { transparent: true, opacity: ghost ? 0.6 : 0.95 }));
          h.rotation.x = -Math.PI / 2; h.position.set(cell.x, 0.14, cell.z);
          c.group.add(h); c.hoops.push(h);
        });
        for (let i = 0; i < N; i++) {
          const g = Math.floor(i / k), j = i % k;
          const ghost = whole && g >= s.n;
          const b = new T.Mesh(geo, ghost ? ghostMat : ballMat);
          const [sx, sz] = slot(cells[g], j, k);
          b.userData = { g, j, slot: [sx, sz], ghost };
          if (!whole) { const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * Math.min(4.8, 1 + Math.sqrt(N) * 0.75); b.position.set(r * Math.cos(a), 0.55 + Math.random() * 0.06, -cells[0].R - 4.2 + r * Math.sin(a) * 0.6); }
          else b.position.set(sx, 0.55, sz);
          b.rotation.set(Math.random() * 6, Math.random() * 6, 0);
          c.group.add(b); c.balls.push(b);

        c.phase = -1;
      }

      if (!whole) {
        if (ph === 0) {
          c.hoops.forEach((h) => (h.material.opacity = 0.35));

          addLbl(`${N} ÷ ${s.d} = ${k}`, 0, 5.4, Math.min(...cells.map((x) => x.z)) - cells[0].R - 1.8, { size: 64, scale: 1.7 });

          <button class="btn" data-replay="1">Rejouer</button>
        </div>
      </div>
      ${free}
    </div>`;
  }
  function tabMatchIntro(st) {
    if (gl) Stage.show("goal", {});
    caption(["Point de penalty, 11 m du but."]);
    return `<div class="doc">
      <div class="say"><span class="count">Avant le match</span><p>${fr("Dix penaltys. Une bonne réponse, c'est un but. Une erreur, le gardien arrête le tir et tu as droit à un deuxième essai avec un indice.")}</p>
      <div class="row"><button class="btn gold" data-tab="atoi">Entrer sur le terrain ▶</button><button class="btn" data-shot="1">Tir d'essai</button></div></div>
      <h3>Les cinq règles à retenir</h3>
      <ul class="why">${st.why.map((w) => `<li>${fr(w)}</li>`).join("")}</ul>
    </div>`;
  }
  function tabPourquoi(st) {
    const pr = st.presets ? st.presets[state.preset] || st.presets[0] : null;
    if (pr) { const step = pr.steps[pr.steps.length - 1]; sceneFor(st, step.s, false); caption([pr.label]); }
    return `<div class="doc"><ul class="why">${st.why.map((w) => `<li>${fr(w)}</li>`).join("")}</ul>
      <div class="row"><button class="btn gold" data-tab="atoi">${st.id === 6 ? "Au match ▶" : "À toi de jouer ▶"}</button></div></div>`;
  }

  /* ── questions ── */
  let qstate = { tries: 0, answered: false, msg: null };
  let lastQKey = "";
  function curQ(st) { const i = state.qi[st.id] || 0; return [i, st.questions[i]]; }
  function tabQuestions(st) {
    const [i, q] = curQ(st);
    const r = R(st.id);
    const total = st.questions.length;
    const dots = st.questions.map((_, k) => `<span class="dot ${r[k] ? r[k].status : ""} ${k === i ? "now" : ""}" title="Question ${k + 1}"></span>`).join("");
    if (i >= total) return endCard(st);
    const qkey = `${st.id}:${i}`, freshQ = qkey !== lastQKey; lastQKey = qkey;
    if (freshQ) qstate.help = false;
    const helpable = q.scene && st.scene !== "pitch" && !(q.scene.mode === "whole" || q.scene.mode === "units-whole");
    if (q.scene) {
      const quiet = helpable && !qstate.help ? Object.assign({}, q.scene, q.scene.mode === "compare" ? { run: false } : { phase: 0 }) : q.scene;
      sceneFor(st, quiet, freshQ);
      caption([`Question ${i + 1}`, helpable && !qstate.help ? "Aide disponible : « Montrer sur le stade »" : null]);
    }
    else if (st.id === 6) { if (gl) Stage.show("goal", { reset: freshQ }); caption([`Penalty ${i + 1} sur ${total}`]); }
    const ans = r[i];
    const locked = !!(ans && ans.status) || qstate.answered;
    let input = "";
    const lastTry = ans && ans.tries && ans.tries.length ? ans.tries[ans.tries.length - 1] : null;
    const shownVal = ans && ans.status === "shown" ? (q.t === "frac" ? q.a : q.a) : lastTry;
    const vN = locked && Array.isArray(shownVal) ? ` value="${shownVal[0]}"` : "", vD = locked && Array.isArray(shownVal) ? ` value="${shownVal[1]}"` : "";
    const vV = locked && shownVal != null && !Array.isArray(shownVal) ? ` value="${esc(String(shownVal).replace(".", ","))}"` : "";
    if (q.t === "frac") input = `<div class="frac-in"><input id="an" inputmode="numeric" maxlength="3" aria-label="Nombre du haut (numérateur)"${vN} ${locked ? "disabled" : ""}><span class="bar"></span><input id="ad" inputmode="numeric" maxlength="3" aria-label="Nombre du bas (dénominateur)"${vD} ${locked ? "disabled" : ""}></div>`;
    else if (q.t === "num") input = `<div class="num-in"><input id="av" inputmode="decimal" maxlength="7" aria-label="Ta réponse"${vV} ${locked ? "disabled" : ""}><span class="unit">${esc(q.unit || "")}</span></div>`;
    else if (q.t === "cmp") input = `<div class="cmp"><span>${fr(`${q.l[0]}/${q.l[1]}`)}</span><span class="slot" id="cmpSlot">${locked && shownVal ? esc(ans && ans.status === "shown" ? q.a : shownVal) : "?"}</span><span>${fr(`${q.r[0]}/${q.r[1]}`)}</span></div><div class="opts" role="group" aria-label="Choisis le signe">${["<", "=", ">"].map((x) => `<button class="btn" data-pick="${esc(x)}" ${locked ? "disabled" : ""} aria-label="${x === "<" ? "plus petit que" : x === ">" ? "plus grand que" : "égal à"}">${esc(x)}</button>`).join("")}</div>`;
    else if (q.t === "choice") input = `<div class="opts">${q.options.map((o, k) => `<button class="btn" data-pick="${k}" ${locked ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>`;
    const showValidate = (q.t === "frac" || q.t === "num") && !locked;
    const fb = qstate.msg ? `<div class="feedback ${qstate.msg.kind}" aria-live="polite">${qstate.msg.html}</div>` : "";
    const next = locked ? `<button class="btn primary" data-next="1">${i + 1 < total ? (st.id === 6 ? "Penalty suivant ▶" : "Question suivante ▶") : "Terminer ▶"}</button>` : "";
    const reveal = !locked && qstate.tries >= 2 ? `<button class="btn" data-reveal="1">Voir la réponse</button>` : "";
    return `<div class="doc" style="gap:14px">
      <div class="qhead"><span class="eyebrow" style="color:var(--muted)">${st.id === 6 ? "Penalty" : "Question"} ${i + 1} / ${total}</span><span class="dots" aria-hidden="true">${dots}</span></div>
      <div class="qcard">
        <p class="qtext">${fr(q.q)}</p>
        <div class="answer">${input}${showValidate ? `<button class="btn primary" data-check="1">Valider</button>` : ""}</div>
        ${fb}
        <div class="row">${helpable && !qstate.help ? `<button class="btn" data-help="1">Montrer sur le stade (aide)</button>` : ""}${reveal}${next}</div>
      </div>
      <p class="muted" style="margin:0">${fr("Indice : demande à ton guide, ou relis l'onglet « Pourquoi ? ». Après deux essais, la réponse s'affiche.")}</p>
    </div>`;
  }
  function endCard(st) {
    const x = stationStats(st.id);
    const nxt = S[st.id + 1];
    if (st.id === 6) {
      if (gl) Stage.show("home");
      caption(["Coup de sifflet final !"]);
      return `<div class="done-card"><h3>Coup de sifflet final</h3><p>${esc(state.prenom || "Toi")} ${goals()} – ${state.against} Les Fractions.</p>
        <p>${x.first} buts du premier coup, ${x.second} au deuxième essai.</p>
        <div class="row"><button class="btn gold" data-go="bilan">Voir le bilan et la note pour la prochaine fois ▶</button><button class="btn" data-restart="6">Rejouer le match</button></div></div>`;
    }
    return `<div class="done-card"><h3>Étape terminée !</h3>
      <p>${x.first} sur ${x.q} du premier coup${x.second ? `, ${x.second} au deuxième essai` : ""}${x.shown ? `, ${x.shown} avec la réponse montrée` : ""}.</p>
      <div class="row">${nxt ? `<button class="btn gold" data-station="${nxt.id}">Étape suivante : ${esc(nxt.short)} ▶</button>` : ""}<button class="btn" data-restart="${st.id}">Refaire les questions</button></div></div>`;
  }
  function trapFor(q, given) {
    if (!q.traps) return null;
    return q.traps.find((t) => (Array.isArray(t.a) && Array.isArray(given) ? t.a[0] === given[0] && t.a[1] === given[1] : t.a === given)) || null;
  }
  const cheers = ["But !", "Bien joué !", "Exact !", "Superbe frappe !", "En pleine lucarne !"];
  function check(st, given) {
    const [i, q] = curQ(st);
    let ok = false, extra = "";
    if (q.t === "frac") {
      if (!given || given[1] === 0) { qstate.msg = { kind: "no", html: `<p>${fr("Le nombre du bas ne peut pas être 0 : on ne peut pas couper en 0 parts.")}</p>` }; render(); return; }
      ok = eqFrac(given, q.a);
      if (ok) {
        const s2 = simp(q.a);
        if (given[0] !== q.a[0] || given[1] !== q.a[1]) extra = ` On peut aussi l'écrire ${q.a[0]}/${q.a[1]}.`;
        if (s2[0] !== q.a[0] && !(given[0] === s2[0] && given[1] === s2[1])) extra += ` En plus simple : ${s2[0]}/${s2[1]}.`;
        if (mixed(q.a)) extra += ` ${q.a[0]}/${q.a[1]}${mixed(q.a)}.`;
      }
    } else if (q.t === "num") ok = Math.abs(given - q.a) < 1e-9;
    else if (q.t === "cmp") ok = given === q.a;
    else if (q.t === "choice") ok = given === q.a;
    const r = R(st.id); r[i] = r[i] || { tries: [] };
    r[i].tries.push(given);
    qstate.tries++;
    if (q.t === "cmp") { const sl = $("#cmpSlot"); if (sl) sl.textContent = given; }
    if (ok) {
      r[i].status = qstate.tries === 1 ? "first" : "second";
      qstate.answered = true;
      qstate.msg = { kind: "ok", html: `<strong>${cheers[(i + qstate.tries) % cheers.length]}</strong><p>${fr(q.why + extra)}</p>` };
      save();
      if (st.id === 6 && gl) { render(); Stage.shoot(true, () => {}); return; }
    } else {
      const trap = trapFor(q, given);
      const hint = q.hint;
      if (qstate.tries >= 2) {
        r[i].status = "shown"; qstate.answered = true;
        if (st.id === 6) state.against++;
        qstate.msg = { kind: "show", html: `<p><b>Pas cette fois.</b> ${fr("La réponse : " + answerText(q) + ".")}</p><p>${fr(q.why)}</p>` };
      } else {
        qstate.msg = { kind: "no", html: `<p><b>${st.id === 6 ? "Arrêté par le gardien !" : "Pas encore."}</b> ${fr(trap ? learnerTrap(trap) : "Essaie encore.")}</p><p>${fr("Indice : " + hint)}</p>` };
      }
      save();
      if (st.id === 6 && gl) { render(); Stage.shoot(false, () => {}); return; }
    }
    render();
  }
  function learnerTrap(t) {
    const n = t.note;
    if (/additionné les numérateurs et les dénominateurs|additionné aussi les dénominateurs/.test(n)) return "On n'additionne pas les nombres du bas : ils donnent la taille des parts.";
    if (/soustrait (aussi )?les (numérateurs et les )?dénominateurs|soustrait aussi/.test(n)) return "On ne soustrait pas les nombres du bas : ils donnent la taille des parts.";
    if (/plus grand dénominateur/.test(n)) return "Attention : plus on coupe, plus les parts sont petites.";
    if (/au lieu de retrouver le tout/.test(n)) return "Ici on connaît une partie. Le tout doit être plus grand.";
    if (/divisé par le numérateur/.test(n)) return "Le nombre du bas dit en combien de groupes on partage.";
    if (/multiplié .* sans diviser/.test(n)) return "Une fraction d'un nombre est plus petite que le nombre entier (si la fraction est plus petite que 1).";
    if (/NON coloriées|parts restantes/.test(n)) return "En bas, on compte TOUTES les parts.";
    if (/sans vérifier/.test(n)) return "Regarde bien la taille de chaque part.";
    if (/sans prendre les 3 groupes/.test(n)) return "Ça, c'est un seul groupe. Combien de groupes faut-il prendre ?";
    return "Essaie encore.";
  }
  function answerText(q) {
    if (q.t === "frac") return `${q.a[0]}/${q.a[1]}`;
    if (q.t === "num") return `${String(q.a).replace(".", ",")} ${q.unit || ""}`.trim();
    if (q.t === "cmp") return `${q.l[0]}/${q.l[1]} ${q.a} ${q.r[0]}/${q.r[1]}`;
    if (q.t === "choice") return q.options[q.a];
    return "";
  }

  /* ── guide ── */
  function guideBlock(st) {
    const g = st.guide;
    return `<div class="gblock">
      <p class="meta">${st.id === 6 ? "Finale" : "Étape " + st.id} · ${esc(g.time)}</p>
      <h3>${fr(st.short + " — " + st.title)}</h3>
      <p><b>Objectif :</b> ${fr(g.goal)}</p>
      <p class="label">Ce que vous pouvez dire</p><ul>${g.say.map((x) => `<li>${fr(x)}</li>`).join("")}</ul>
      <p class="label">Questions à lui poser</p><ul>${g.ask.map((x) => `<li>${fr(x)}</li>`).join("")}</ul>
      <p class="label">À surveiller</p><ul>${g.watch.map((x) => `<li>${fr(x)}</li>`).join("")}</ul>
      <p class="label">Sans écran</p><p>${fr(g.offscreen)}</p>
      <p class="label">Corrigé</p><ol class="key">${st.questions.map((q) => `<li>${fr(q.q)} <b>→ ${fr(answerText(q))}</b>. ${fr(q.why)}</li>`).join("")}</ol>
    </div>`;
  }
  function tabGuide(st) {
    return `<div class="doc"><p class="muted">${fr("Cet onglet est pour vous, le guide. Les réponses sont en bas.")}</p>${guideBlock(st)}</div>`;
  }
  function viewGuide() {
    if (gl) Stage.show("home");
    caption(["Le guide : tout le parcours sur une page."]);
    const sheet = S.map((st) => `<div class="gblock"><h3>${fr((st.id === 6 ? "Grand match" : "Étape " + st.id) + " — " + st.title)}</h3><ol class="key">${st.questions.map((q) => `<li>${fr(q.t === "cmp" ? `Compare ${q.l[0]}/${q.l[1]} et ${q.r[0]}/${q.r[1]} (<, = ou >).` : q.q)} ${q.t === "choice" ? "(" + q.options.join(" / ") + ")" : ""} ……………</li>`).join("")}</ol></div>`).join("");
    return `<div class="panel-inner doc">
      <div><p class="eyebrow">Pour le guide</p><h2 class="title">Comment accompagner le parcours</h2></div>
      ${COURSE.guideIntro.map((p) => `<p>${fr(p)}</p>`).join("")}
      ${canPrint ? `<div class="row no-print"><button class="btn primary" data-print="1">Imprimer le guide et la fiche</button></div>` : ""}
      <h2>Étape par étape</h2>
      ${S.map(guideBlock).join("")}
      <h2>Fiche de l'apprenant (questions sans réponses)</h2>
      <p class="muted">${fr("À recopier dans un cahier, ou à imprimer, pour travailler sans écran.")}</p>
      ${sheet}
    </div>`;
  }

  /* ── bilan et note pour la prochaine fois ── */
  function buildNote() {
    const name = state.prenom || "L'apprenant";
    const today = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    const lines = [];
    lines.push(`NOTE POUR LA PROCHAINE FOIS — Le Stade des Fractions`);
    lines.push(`Date : ${today}`);
    lines.push(`Apprenant : ${name}, 11 ans. Thèmes qui l'aident : football et course.`);
    lines.push("");
    lines.push("Ce qui a été fait :");
    let any = false;
    S.forEach((st) => {
      const x = stationStats(st.id);
      if (!x.done) return; any = true;
      lines.push(`- ${st.id === 6 ? "Grand match" : "Étape " + st.id + " (" + st.short + ")"} : ${x.first} sur ${x.q} du premier coup, ${x.second} au deuxième essai, ${x.shown} réponse(s) montrée(s).`);
    });
    if (!any) lines.push("- Rien pour l'instant.");
    lines.push("");
    const hard = [], good = [];
    S.forEach((st) => {
      const r = state.res[st.id] || {};
      st.questions.forEach((q, i) => {
        const a = r[i]; if (!a || !a.status) return;
        if (a.status === "first") { good.push(`${st.short} : ${q.q}`); return; }
        const firstWrong = a.tries[0];
        const t = trapFor(q, firstWrong);
        const shown = Array.isArray(firstWrong) ? `${firstWrong[0]}/${firstWrong[1]}` : String(firstWrong);
        hard.push(`- ${st.short} — « ${q.q} » Première réponse : ${shown}${t ? ` (${name} ${t.note.replace(/\.$/, "")})` : ""}. Bonne réponse : ${answerText(q)}.`);
      });
    });
    lines.push("Ce qui a posé problème :");
    lines.push(...(hard.length ? hard : ["- Rien de particulier."]));
    lines.push("");
    lines.push(`Réussi du premier coup : ${good.length} question(s).`);
    lines.push("");
    const weak = S.find((st) => { const x = stationStats(st.id); return x.done === x.q && x.first < x.q - 1; });
    const notDone = S.find((st) => stationStats(st.id).done < st.questions.length);
    lines.push("Prochaine séance :");
    if (weak) lines.push(`- Reprendre l'étape ${weak.id} (${weak.short}) : revoir « Pourquoi ? », puis refaire les questions.`);
    if (notDone) lines.push(`- Continuer avec ${notDone.id === 6 ? "le Grand match" : "l'étape " + notDone.id + " (" + notDone.short + ")"}.`);
    if (!weak && !notDone) lines.push("- Tout le parcours est fait. Idée : inventer ensemble des problèmes de fractions sur un vrai match ou une vraie course, puis passer aux fractions et aux nombres décimaux (1/2 = 0,5 ; 1/4 = 0,25).");
    lines.push("");
    lines.push("Pour reprendre : gardez cette note dans le cahier. Si vous utilisez un assistant IA, collez-la au début de la prochaine séance pour qu'il reparte d'ici.");
    return lines.map(plain).join("\n");
  }
  function viewBilan() {
    if (gl) Stage.show("home");
    caption(["Bilan du parcours"]);
    const rows = S.map((st) => { const x = stationStats(st.id); return `<tr><td>${st.id === 6 ? "★" : st.id} ${esc(st.short)}</td><td>${x.done}/${x.q}</td><td>${x.first}</td><td>${x.second}</td><td>${x.shown}</td></tr>`; }).join("");
    const conf = state.confirmReset
      ? `<div class="confirm"><p style="margin:0">Effacer toutes les réponses enregistrées sur cet appareil ?</p><div class="row"><button class="btn" data-reset="yes">Oui, tout effacer</button><button class="btn primary" data-reset="no">Non, garder</button></div></div>`
      : `<button class="btn" data-reset="ask">Effacer la progression</button>`;
    return `<div class="panel-inner doc">
      <div><p class="eyebrow">Bilan</p><h2 class="title">Où en est ${esc(state.prenom || "l'apprenant")}</h2></div>
      <div class="table-wrap"><table class="res"><thead><tr><th>Étape</th><th>Faites</th><th>1er coup</th><th>2e essai</th><th>Montrées</th></tr></thead><tbody>${rows}</tbody></table></div>
      <h3>Note pour la prochaine fois</h3>
      <p class="muted">${fr("Elle décrit ce qui s'est passé, sans juger. Gardez-la dans le cahier, ou collez-la au début de la prochaine séance.")}</p>
      <textarea class="note" id="note" readonly aria-label="Note pour la prochaine fois">${esc(buildNote())}</textarea>
      <div class="row"><button class="btn primary" data-copy="1">Copier la note</button><span id="copied" class="muted" aria-live="polite"></span></div>
      <div class="row no-print">${conf}</div>
    </div>`;
  }

  /* ── événements ── */
  function go(view, extra) {
    Object.assign(state, { view }, extra || {});
    qstate = { tries: 0, answered: false, msg: null };
    render();
    if (window.innerWidth < 960 && state.view === "station") { const pTop = $("#panel").getBoundingClientRect().top + window.scrollY - $(".bar").offsetHeight - $("#stage-wrap").offsetHeight; if (window.scrollY > pTop + 40) window.scrollTo({ top: Math.max(0, pTop), behavior: "smooth" }); }
  }
  function bindPanel() {
    const p = $("#panel");
    const pren = $("#prenom", p), mai = $("#maillot", p);
    if (pren) pren.addEventListener("input", () => { state.prenom = pren.value.trim().slice(0, 16); save(); renderTop(); });
    if (mai) mai.addEventListener("input", () => { const v = parseInt(mai.value, 10); state.maillot = isNaN(v) ? 10 : Math.max(1, Math.min(99, v)); save(); renderTop(); });
    p.querySelectorAll("input#an, input#ad, input#av").forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const b = $("[data-check]", p); b && b.click(); } }));
    const first = $("input#an, input#av", p); if (first && !first.disabled && state.view === "station") first.focus({ preventScroll: true });
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    if (d.go) { go(d.go); return; }
    if (d.station != null) { const id = +d.station; go("station", { station: id, tab: "regarde", preset: 0, step: 0 }); return; }
    if (d.tab) { state.tab = d.tab; qstate = { tries: 0, answered: false, msg: null }; render(); return; }
    const st = S[state.station];
    if (d.preset != null) { state.free.active = false; state.preset = +d.preset; state.step = 0; const s0 = st.presets[state.preset].steps[0].s; sceneFor(st, s0, true); render(); return; }
    if (d.step) { state.free.active = false; const pr = st.presets[state.preset]; state.step = Math.max(0, Math.min(pr.steps.length - 1, state.step + +d.step)); render(); return; }
    if (d.replay) {
      state.free.active = false;
      const pr = st.presets[state.preset];
      state.step = 0; sceneFor(st, pr.steps[0].s, true);
      let k = 0;
      const adv = () => { if (state.view !== "station" || state.tab !== "regarde" || S[state.station] !== st || state.preset !== st.presets.indexOf(pr)) return; if (k < pr.steps.length - 1) { k++; state.step = k; render(); setTimeout(adv, 3600); } };
      render(); setTimeout(adv, 3200);
      return;
    }
    if (d.free) {
      if (d.free !== "go") state.free.d = Math.max(1, Math.min(12, state.free.d + +d.free));
      state.free.active = true; state.free.n = 0; state.free.sel = null;
      sceneFor(st, { d: state.free.d, n: 0 }, true);
      render(); return;
    }
    if (d.check) {
      const [, q] = curQ(st);
      if (q.t === "frac") {
        const n = parseInt($("#an").value, 10), dd = parseInt($("#ad").value, 10);
        if (isNaN(n) || isNaN(dd)) { qstate.msg = { kind: "no", html: `<p>${fr("Écris un nombre en haut et un nombre en bas.")}</p>` }; render(); return; }
        check(st, [n, dd]);
      } else {
        const v = parseFloat(String($("#av").value).replace(",", ".").replace(/\s/g, ""));
        if (isNaN(v)) { qstate.msg = { kind: "no", html: `<p>Écris un nombre.</p>` }; render(); return; }
        check(st, v);
      }
      return;
    }
    if (d.pick != null) { const [, q] = curQ(st); check(st, q.t === "choice" ? +d.pick : d.pick); return; }
    if (d.reveal) {
      const [i, q] = curQ(st); const r = R(st.id); r[i] = r[i] || { tries: [] }; r[i].status = "shown"; qstate.answered = true;
      if (st.id === 6) state.against++;
      qstate.msg = { kind: "show", html: `<p><b>La réponse :</b> ${fr(answerText(q))}.</p><p>${fr(q.why)}</p>` }; save(); render(); return;
    }
    if (d.next) { state.qi[st.id] = (state.qi[st.id] || 0) + 1; qstate = { tries: 0, answered: false, msg: null }; save(); render(); return; }
    if (d.restart != null) { const id = +d.restart; state.res[id] = {}; state.qi[id] = 0; if (id === 6) state.against = 0; qstate = { tries: 0, answered: false, msg: null }; save(); render(); return; }
    if (d.help) { qstate.help = true; const [, q] = curQ(st); sceneFor(st, q.scene, true); lastQKey = `${st.id}:${state.qi[st.id] || 0}`; render(); return; }
    if (d.shot) { if (gl) Stage.shoot(true, () => {}); return; }
    if (d.copy) {
      const ta = $("#note"), txt = ta.value, out = $("#copied");
      const fallback = () => { ta.focus(); ta.select(); out.textContent = "Sélectionné : copiez avec Ctrl+C (ou appui long)."; };
      try { navigator.clipboard.writeText(txt).then(() => (out.textContent = "Note copiée."), fallback); } catch (err) { fallback(); }
      return;
    }
    if (d.reset) {
      if (d.reset === "ask") state.confirmReset = true;
      else if (d.reset === "yes") { state.res = {}; state.qi = {}; state.against = 0; state.confirmReset = false; save(); }
      else state.confirmReset = false;
      render(); return;
    }
    if (d.print) { try { window.print(); } catch (err) { /* rien */ } return; }
  });

  /* ── démarrage ── */
  function start() {
    const setBar = () => { const b = $(".bar"); if (b) document.documentElement.style.setProperty("--bar-h", b.offsetHeight + "px"); };
    setBar(); window.addEventListener("resize", setBar);
    try { document.documentElement.lang = "fr"; } catch (e) { /* rien */ }
    load();
    const host = $("#stage");
    gl = !!(window.THREE && Stage.init(host, isDark()));
    if (!gl) host.innerHTML = `<div class="nogl"><p>La vue 3D ne s'affiche pas sur cet appareil. Toutes les explications, les questions et le guide marchent quand même.</p></div>`;
    else {
      $("#hint3d").hidden = false;
      Stage.onStrip = (n, dd, sel) => {
        state.free.active = true; state.free.n = n; state.free.d = dd || state.free.d; state.free.sel = sel || null;
        const o = $("#freeOut"); if (o) o.innerHTML = fr(`${n}/${state.free.d}`);
        caption([`${n}/${state.free.d} du terrain`]);
      };
      const mq = window.matchMedia && matchMedia("(prefers-color-scheme: dark)");
      const upd = () => Stage.setTheme(isDark());
      if (mq && mq.addEventListener) mq.addEventListener("change", upd);
      new MutationObserver(upd).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    }
    render();
  }
  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve();
  fontsReady.then(start);
})();
</script>
</body>
